name: Build V25 Mario Kart L/R Mirror Windows

on:
  pull_request:
    branches: [v25-ci-base]
    paths:
      - "V25-CI-TRIGGER.txt"
      - "tools/apply_cemu_v25_mario_kart_lr_mirror.py"
      - ".github/workflows/build-cemu-v25-pr.yml"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply V15 V16 V21 V22 then isolate V25-X
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          git -C cemu diff --check
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          foreach ($marker in @('V22 hardware-driven motion basis','V22: final Joy-Con R accelerometer','tracking.acc.x = -tracking.acc.x;','tracking.acc.z = -tracking.acc.z;')) {
            if (-not $provider.Contains($marker)) { throw "V22 marker missing: $marker" }
          }
          Copy-Item "cemu\src\input\emulated\WPADController.cpp" "$env:RUNNER_TEMP\V22-WPADController.cpp" -Force
          function Get-SourceHashes {
            $root = (Resolve-Path "cemu\src").Path; $map = @{}
            Get-ChildItem $root -Recurse -File | ForEach-Object { $rel=$_.FullName.Substring($root.Length+1); $map[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            return $map
          }
          $before=Get-SourceHashes
          python wrapper\tools\apply_cemu_v25_mario_kart_lr_mirror.py cemu X
          git -C cemu diff --check
          $after=Get-SourceHashes
          $changed=@($before.Keys | Where-Object { -not $after.ContainsKey($_) -or $before[$_] -ne $after[$_] })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'input\emulated\WPADController.cpp') { throw "V25-X isolation failure: $($changed -join ', ')" }
          $wpad=Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          foreach ($marker in @('V25-X: single-axis steering mirror','source_name.find("Joy-Con")','source_name.find("(L)")','source_name.find("(R)")','if (joycon_left && !joycon_right)','acc.x = acc.z;','acc.z = -pre_quarter_x;','type() == Wiimote && !is_mpls_attached() && is_mario_kart_8')) {
            if (-not $wpad.Contains($marker)) { throw "V25-X marker missing: $marker" }
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build V25-X Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Capture V25-X
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "package\V25-X" | Out-Null
          Copy-Item "cemu\bin\Cemu_release.exe" "package\V25-X\Cemu.exe" -Force
          $h=(Get-FileHash "package\V25-X\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $h" | Set-Content "package\V25-X\SHA256.txt" -Encoding ascii

      - name: Restore V22 then isolate V25-Z
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP\V22-WPADController.cpp" "cemu\src\input\emulated\WPADController.cpp" -Force
          function Get-SourceHashes {
            $root=(Resolve-Path "cemu\src").Path; $map=@{}
            Get-ChildItem $root -Recurse -File | ForEach-Object { $rel=$_.FullName.Substring($root.Length+1); $map[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            return $map
          }
          $before=Get-SourceHashes
          python wrapper\tools\apply_cemu_v25_mario_kart_lr_mirror.py cemu Z
          git -C cemu diff --check
          $after=Get-SourceHashes
          $changed=@($before.Keys | Where-Object { -not $after.ContainsKey($_) -or $before[$_] -ne $after[$_] })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'input\emulated\WPADController.cpp') { throw "V25-Z isolation failure: $($changed -join ', ')" }
          $wpad=Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          foreach ($marker in @('V25-Z: single-axis steering mirror','source_name.find("Joy-Con")','if (joycon_left && !joycon_right)','acc.x = acc.z;','acc.z = -pre_quarter_x;')) {
            if (-not $wpad.Contains($marker)) { throw "V25-Z marker missing: $marker" }
          }

      - name: Build V25-Z Release incremental
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V25
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "package\V25-Z" | Out-Null
          Copy-Item "cemu\bin\Cemu_release.exe" "package\V25-Z\Cemu.exe" -Force
          $hx=(Get-FileHash "package\V25-X\Cemu.exe" -Algorithm SHA256).Hash
          $hz=(Get-FileHash "package\V25-Z\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hz" | Set-Content "package\V25-Z\SHA256.txt" -Encoding ascii
          @"
          Cemu Joy-Con Mario Kart KPAD V25
          Base: hardware-approved V22; V23/V24 are not in the runtime chain.
          Test with MotionPlus OFF, orientation set to Vertical, and each Joy-Con held naturally horizontal.
          V25 normalizes Joy-Con L by 180 degrees inside Mario Kart KPAD only, reproduces the tested V24-A horizontal plane, then mirrors exactly one steering axis.
          V25-X mirrors KPAD X; V25-Z mirrors KPAD Z.
          All other titles and V22 motion/pointer/gyro/calibration/buttons/sticks are untouched.
          "@ | Set-Content "package\README-V25.txt" -Encoding utf8
          "V25-X/Cemu.exe SHA-256: $hx`nV25-Z/Cemu.exe SHA-256: $hz" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-JoyCon-Mario-Kart-KPAD-V25-LR-Mirror-Windows-x64.zip" -CompressionLevel Optimal -Force

      - name: Upload V25 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Mario-Kart-KPAD-V25-LR-Mirror-Windows-x64
          path: Cemu-JoyCon-Mario-Kart-KPAD-V25-LR-Mirror-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
