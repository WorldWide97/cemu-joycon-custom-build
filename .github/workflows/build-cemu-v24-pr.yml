name: Build V24 Mario Kart KPAD 90 Windows

on:
  pull_request:
    branches: [v24-ci-base]
    paths:
      - "V24-CI-TRIGGER.txt"
      - "tools/apply_cemu_v24_mario_kart_kpad_90.py"
      - ".github/workflows/build-cemu-v24-pr.yml"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply V15 V16 V21 V22 then isolate V24-A
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          git -C cemu diff --check

          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $wpadV22 = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw

          foreach ($marker in @(
            "V22 hardware-driven motion basis",
            "if (!config->second.vertical)",
            "V22: final Joy-Con R accelerometer",
            "tracking.acc.x = -tracking.acc.x;",
            "tracking.acc.z = -tracking.acc.z;"
          )) {
            if (-not $provider.Contains($marker)) { throw "V22 provider marker missing before V24: $marker" }
          }

          foreach ($marker in @(
            "Pointer Calibration Period (s)",
            "Game Gyro Calibration:",
            "Pointer Calibration:"
          )) {
            if (-not $panel.Contains($marker)) { throw "V22/V21 calibration marker missing before V24: $marker" }
          }

          foreach ($marker in @(
            "V16 restores the exact V7/upstream Cemu KPAD down contract",
            "status.accVertical.x = std::min(1.0f, std::abs(acc.x + acc.y))",
            "status.accVertical.y = std::min(std::max(-1.0f, -acc.z), 1.0f)"
          )) {
            if (-not $wpadV22.Contains($marker)) { throw "V22 KPAD baseline marker missing before V24: $marker" }
          }

          Copy-Item "cemu\src\input\emulated\WPADController.cpp" "$env:RUNNER_TEMP\V22-WPADController.cpp" -Force

          function Get-SourceHashes {
            $srcRoot = (Resolve-Path "cemu\src").Path
            $map = @{}
            Get-ChildItem $srcRoot -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($srcRoot.Length + 1)
              $map[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }
            return $map
          }

          $before = Get-SourceHashes
          python wrapper\tools\apply_cemu_v24_mario_kart_kpad_90.py cemu A
          git -C cemu diff --check
          $after = Get-SourceHashes
          $changed = @($before.Keys | Where-Object { -not $after.ContainsKey($_) -or $before[$_] -ne $after[$_] })
          $expected = "input\emulated\WPADController.cpp"
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "V24-A isolation failure. Expected only $expected; changed: $($changed -join ', ')"
          }

          $wpadA = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          foreach ($marker in @(
            "V24-A: Mario Kart 8 Wii Wheel only, MotionPlus OFF.",
            "acc.x = acc.z;",
            "acc.z = -old_x;",
            "foreground_base_title == 0x000500001010EB00ULL",
            "foreground_base_title == 0x000500001010EC00ULL",
            "foreground_base_title == 0x000500001010ED00ULL",
            "type() == Wiimote && !is_mpls_attached() && is_mario_kart_8"
          )) {
            if (-not $wpadA.Contains($marker)) { throw "V24-A marker missing: $marker" }
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build V24-A Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Capture V24-A
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "V24-A Cemu executable was not produced" }
          New-Item -ItemType Directory -Force "package\V24-90A" | Out-Null
          Copy-Item $exe "package\V24-90A\Cemu.exe" -Force
          $hashA = (Get-FileHash "package\V24-90A\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hashA" | Set-Content "package\V24-90A\SHA256.txt" -Encoding ascii
          Write-Host "V24-A Cemu.exe SHA-256: $hashA"

      - name: Restore V22 then isolate V24-B
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP\V22-WPADController.cpp" "cemu\src\input\emulated\WPADController.cpp" -Force

          function Get-SourceHashes {
            $srcRoot = (Resolve-Path "cemu\src").Path
            $map = @{}
            Get-ChildItem $srcRoot -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($srcRoot.Length + 1)
              $map[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }
            return $map
          }

          $before = Get-SourceHashes
          python wrapper\tools\apply_cemu_v24_mario_kart_kpad_90.py cemu B
          git -C cemu diff --check
          $after = Get-SourceHashes
          $changed = @($before.Keys | Where-Object { -not $after.ContainsKey($_) -or $before[$_] -ne $after[$_] })
          $expected = "input\emulated\WPADController.cpp"
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "V24-B isolation failure. Expected only $expected; changed: $($changed -join ', ')"
          }

          $wpadB = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          foreach ($marker in @(
            "V24-B: Mario Kart 8 Wii Wheel only, MotionPlus OFF.",
            "acc.x = -acc.z;",
            "acc.z = old_x;",
            "foreground_base_title == 0x000500001010EB00ULL",
            "foreground_base_title == 0x000500001010EC00ULL",
            "foreground_base_title == 0x000500001010ED00ULL",
            "type() == Wiimote && !is_mpls_attached() && is_mario_kart_8"
          )) {
            if (-not $wpadB.Contains($marker)) { throw "V24-B marker missing: $marker" }
          }

      - name: Build V24-B Release incremental
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Capture and package V24-B
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "V24-B Cemu executable was not produced" }
          New-Item -ItemType Directory -Force "package\V24-90B" | Out-Null
          Copy-Item $exe "package\V24-90B\Cemu.exe" -Force
          $hashB = (Get-FileHash "package\V24-90B\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hashB" | Set-Content "package\V24-90B\SHA256.txt" -Encoding ascii

          @"
          Cemu Joy-Con Mario Kart KPAD V24
          =================================
          Hardware-approved base: V22.

          Scope:
          - Mario Kart 8 only (JP/USA/EUR Title IDs).
          - Wii Remote KPAD accelerometer delivery only.
          - MotionPlus must be OFF.
          - No deadzone, smoothing, hysteresis or sensitivity changes.
          - V22 Joy-Con Sideways/Vertical, R accelerometer correction, game gyro,
            pointer, calibration, buttons and sticks are untouched.
          - CI verifies that from V22 to either V24 variant the only changed file
            under cemu/src is src/input/emulated/WPADController.cpp.

          Why two variants:
          The hardware report establishes a 90-degree physical quarter-turn, but
          90 degrees has two possible signs in Cemu's KPAD coordinate frame.
          Both are built in one CI run so the correct sign can be identified in
          seconds without another full compile cycle.

          V24-90A:
            +90 around KPAD Y: X'=Z, Y'=Y, Z'=-X

          V24-90B:
            -90 around KPAD Y: X'=-Z, Y'=Y, Z'=X

          Test:
          1) Keep MotionPlus OFF.
          2) Copy V24-90A/Cemu.exe into the normal Cemu folder and test Mario Kart 8.
          3) If the wheel direction/orientation is wrong, test V24-90B/Cemu.exe.
          4) Do not change the Joy-Con orientation or calibration between tests.
          "@ | Set-Content "package\README-V24.txt" -Encoding utf8

          $hashA = (Get-FileHash "package\V24-90A\Cemu.exe" -Algorithm SHA256).Hash
          @"
          V24-90A/Cemu.exe SHA-256: $hashA
          V24-90B/Cemu.exe SHA-256: $hashB
          "@ | Set-Content "package\SHA256.txt" -Encoding ascii

          Compress-Archive -Path "package\*" -DestinationPath "Cemu-JoyCon-Mario-Kart-KPAD-V24-90-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "V24-B Cemu.exe SHA-256: $hashB"

      - name: Upload V24 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Mario-Kart-KPAD-V24-90-Windows-x64
          path: Cemu-JoyCon-Mario-Kart-KPAD-V24-90-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
