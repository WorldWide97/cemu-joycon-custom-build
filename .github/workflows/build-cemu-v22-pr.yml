name: Build V22 Motion Basis Windows

on:
  pull_request:
    branches: [v22-ci-base]
    paths:
      - "V22-CI-TRIGGER.txt"
      - "tools/apply_cemu_v22_motion_basis_fix.py"
      - ".github/workflows/build-cemu-v22-pr.yml"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply V15 V16 V21 and V22
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          git -C cemu diff --check

          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw

          foreach ($marker in @(
            "V22 hardware-driven motion basis",
            "if (!config->second.vertical)",
            "v9_game_sensor[0] = -z;",
            "v9_game_sensor[2] = x;",
            "v9_game_sensor[0] = z;",
            "v9_game_sensor[2] = -x;",
            "V22: final Joy-Con R accelerometer",
            "tracking.acc.x = -tracking.acc.x;",
            "tracking.acc.z = -tracking.acc.z;"
          )) {
            if (-not $provider.Contains($marker)) { throw "V22 provider marker missing: $marker" }
          }

          foreach ($forbidden in @(
            "V15 hardware-proven Joy-Con R Sideways correction: 180 degrees.",
            "v9_game_sensor[0] = -x;\r\n\t\t\t\t\tv9_game_sensor[1] = y;\r\n\t\t\t\t\tv9_game_sensor[2] = -z;"
          )) {
            if ($provider.Contains($forbidden)) { throw "Old pre-basis R correction still active: $forbidden" }
          }

          foreach ($marker in @(
            "V16 restores the exact V7/upstream Cemu KPAD down contract",
            "status.accVertical.x = std::min(1.0f, std::abs(acc.x + acc.y))",
            "status.accVertical.y = std::min(std::max(-1.0f, -acc.z), 1.0f)"
          )) {
            if (-not $wpad.Contains($marker)) { throw "V16 KPAD changed unexpectedly: $marker" }
          }

          foreach ($marker in @(
            "Pointer Calibration Period (s)",
            "Game Gyro Calibration:",
            "Pointer Calibration:"
          )) {
            if (-not $panel.Contains($marker)) { throw "V21 calibration UI unexpectedly lost: $marker" }
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V22
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Motion Basis V22
          =============================
          Base: V21 on V16 stable architecture.

          V22 hardware-directed corrections:
          - Sideways/Vertical GAME MOTION basis itself is swapped to match the user's physical tests; this is not merely a UI-label change.
          - Stick/buttons remain on their already-working orientation path.
          - Old V15 pre-basis Joy-Con R correction is removed from the game sensor transform.
          - Joy-Con R accelerometer receives one final 180-degree X/Z correction after the selected motion basis is formed.
          - Pointer remains independent.
          - V16 KPAD/down formula is unchanged; no Mario Kart deadzone/smoothing added.
          - V21 independent Game Gyro and Pointer calibration remain present.

          Hardware test priority:
          1) Mario Party Sideways on Joy-Con L: horizontal physical motion must now behave as Sideways.
          2) Repeat with Joy-Con R; R must no longer require physical reversal.
          3) Select Vertical and verify its motion basis is the complementary orientation.
          4) Then test Mario Kart steering.
          "@ | Set-Content "package\README-V22.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-JoyCon-Motion-Basis-V22-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload V22 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Motion-Basis-V22-Windows-x64
          path: Cemu-JoyCon-Motion-Basis-V22-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
