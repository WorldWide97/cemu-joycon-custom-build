name: Build V21 Motion Stack Windows

on:
  pull_request:
    branches: [v21-ci-base]
    paths:
      - "V21-CI-TRIGGER.txt"
      - "tools/apply_cemu_v21_motion_stack.py"
      - ".github/workflows/build-cemu-v21-pr.yml"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply V15 V16 and V21
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          git -C cemu diff --check

          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $providerH = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.h" -Raw
          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $controllerH = Get-Content "cemu\src\input\api\SDL\SDLController.h" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $motion = Get-Content "cemu\src\input\motion\MotionHandler.h" -Raw
          $mahony = Get-Content "cemu\src\input\motion\Mahony.h" -Raw

          foreach ($marker in @(
            "V21: labels and enum now match 1:1. Sideways=0, Vertical=1.",
            "original_orientation == SDLController::JoyConOrientation::Vertical ? 1 : 0",
            "SDLController::JoyConOrientation::Sideways : SDLController::JoyConOrientation::Vertical",
            "Pointer Calibration Period (s)",
            "Game Gyro Calibration:",
            "Pointer Calibration:"
          )) {
            if (-not $panel.Contains($marker)) { throw "V21 UI marker missing: $marker" }
          }

          foreach ($marker in @(
            "V15 hardware-proven Joy-Con R Sideways correction: 180 degrees.",
            "v9_game_sensor[0] = -x;",
            "v9_game_sensor[1] = y;",
            "v9_game_sensor[2] = -z;",
            "V21 game gyro: preserve V16's exact physical axes",
            "state.game_gyro_bias",
            "tracking.gyro = game_gyro",
            "state.handler.processCalibratedMotionSample"
          )) {
            if (-not $provider.Contains($marker)) { throw "V21 provider marker missing: $marker" }
          }

          foreach ($marker in @(
            "pointer_calibration_period_seconds{ 3.0f }",
            "game_gyro_bias",
            "game_calibration_period_seconds"
          )) {
            if (-not $providerH.Contains($marker)) { throw "V21 provider header marker missing: $marker" }
          }

          foreach ($marker in @(
            "get_pointer_calibration_period_seconds",
            "m_pointer_calibration_period_seconds"
          )) {
            if (-not $controllerH.Contains($marker)) { throw "V21 controller header marker missing: $marker" }
          }
          if (-not $controller.Contains("joycon_pointer_calibration_period_s")) { throw "Pointer calibration period is not persisted" }

          foreach ($marker in @(
            "V16 restores the exact V7/upstream Cemu KPAD down contract",
            "status.accVertical.x = std::min(1.0f, std::abs(acc.x + acc.y))",
            "status.accVertical.y = std::min(std::max(-1.0f, -acc.z), 1.0f)"
          )) {
            if (-not $wpad.Contains($marker)) { throw "V16 KPAD changed unexpectedly: $marker" }
          }

          if (-not $motion.Contains("processCalibratedMotionSample")) { throw "Calibrated MotionHandler entry point missing" }
          if (-not $mahony.Contains("updateIMUCalibrated")) { throw "Calibrated Mahony entry point missing" }
          if (-not $mahony.Contains("learn_internal_bias")) { throw "Mahony bias bypass marker missing" }

          foreach ($forbidden in @(
            "V18 game motion is the calibrated Dolphin semantic stream",
            "dolphin_game_gyro_bias",
            "V19 gyro-only fix: use the physical/native Joy-Con gyro basis",
            "V20: Joy-Con R natural Sideways physical orientation"
          )) {
            if ($provider.Contains($forbidden)) { throw "Forbidden post-V16 path leaked into V21: $forbidden" }
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V21
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Motion Stack V21
          ==============================
          Baseline: V16 stable c78d7ce9f4cd4dd247acbe57e495d1b92c8eb6a1

          V21 fixes:
          - Motion Input Sideways/Vertical labels now map to the correct enum.
          - V15 hardware-tested Joy-Con R Sideways 180-degree accelerometer basis remains intact.
          - V16 exact KPAD/down contract remains intact; no Mario Kart deadzone/smoothing was added.
          - Game Gyro now has real per-Joy-Con X/Y/Z stable-mean calibration using the existing Gyro Dead Zone and Calibration Period controls.
          - Joy-Con Game Gyro bypasses the second broad Mahony bias learner after external calibration.
          - Pointer has a separate automatic Pointer Calibration Period control (0 disables, 0-30 seconds configurable).
          - Pointer and Game Gyro calibration status/bias are shown independently in Motion Input.
          - No V17/V18/V19/V20 game-motion routing is included.

          First hardware test:
          1) Open Motion Input and explicitly choose Sideways once for horizontal Joy-Con play; old V16 profiles may have stored the opposite enum because of the old UI bug.
          2) Hold each Joy-Con still for the configured Game Gyro and Pointer calibration periods.
          3) Test Mario Party motion on L/R, then Mario Kart wheel steering, then pointer drift.
          "@ | Set-Content "package\README-V21.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-JoyCon-Motion-Stack-V21-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload V21 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Motion-Stack-V21-Windows-x64
          path: Cemu-JoyCon-Motion-Stack-V21-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
