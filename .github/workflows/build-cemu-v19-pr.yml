name: Build V20 R Gyro Test Windows

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-cemu-v19-pr.yml"
      - "tools/apply_cemu_v19_physical_joycon_gyro.py"
      - "tools/apply_cemu_v20_r_sideways_gyro.py"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply V15 V16 V19 and V20 R gyro fix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v19_physical_joycon_gyro.py cemu
          python wrapper\tools\apply_cemu_v20_r_sideways_gyro.py cemu
          git -C cemu diff --check

          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          foreach ($marker in @(
            "V19 gyro-only fix: use the physical/native Joy-Con gyro basis",
            "glm::vec3 game_gyro = raw_gyro",
            "Stock Dolphin Joy-Con L Sideways orientation: RotateZ(-90)",
            "V20: Joy-Con R natural Sideways physical orientation is RotateZ(+90)",
            "game_gyro.x = -game_gyro.y",
            "game_gyro.y = old_x",
            "tracking.gyro = game_gyro"
          )) {
            if (-not $provider.Contains($marker)) { throw "V20 gyro marker missing: $marker" }
          }
          foreach ($marker in @(
            "V16 restores the exact V7/upstream Cemu KPAD down contract",
            "status.accVertical.x = std::min(1.0f, std::abs(acc.x + acc.y))",
            "status.accVertical.y = std::min(std::max(-1.0f, -acc.z), 1.0f)"
          )) {
            if (-not $wpad.Contains($marker)) { throw "V16 KPAD marker missing: $marker" }
          }
          if ($provider.Contains("User/hardware-proven Joy-Con R Sideways orientation: RotateZ(180)")) { throw "Old V19 R gyro rotation leaked into V20" }
          if ($provider.Contains("glm::vec3 game_acc = dolphin_acc")) { throw "Accelerometer changed from V16" }
          if ($provider.Contains("dolphin_game_gyro_bias")) { throw "V17 gyro path leaked into V20" }
          if ($provider.Contains("V18 game motion is the calibrated Dolphin semantic stream")) { throw "V18 path leaked into V20" }
          if ($provider.Contains("state.handler.processDolphinMotionSample(tsDifD")) { throw "Game MotionHandler path changed from V16" }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V20
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con R Sideways Gyro V20
          =================================
          Baseline: V16 c78d7ce9f4cd4dd247acbe57e495d1b92c8eb6a1
          V19 base: physical/native Joy-Con game gyro mapping.
          V20 change: Joy-Con R Sideways gyro only, RotateZ(180) -> RotateZ(+90).
          Joy-Con L Sideways remains the hardware-confirmed correct RotateZ(-90) path.
          Preserved from V16: accelerometer, V7 KPAD/down, pointer, UI and all remaining behavior.
          No V17 game-gyro calibration and no V18 Dolphin accelerometer/game-motion routing.
          "@ | Set-Content "package\README-V20.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-JoyCon-Dolphin-WiiRemote-V20-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload V20 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Dolphin-WiiRemote-V20-Windows-x64
          path: Cemu-JoyCon-Dolphin-WiiRemote-V20-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
