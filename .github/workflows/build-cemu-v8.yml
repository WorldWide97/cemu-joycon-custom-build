name: Build Cemu Joy-Con Precision V9

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-cemu-v8.yml"
      - "tools/apply_cemu_v9_precision_motion_pointer.py"
      - "V9-BUILD-TRIGGER.txt"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1 verified prefix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core missing" }
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V7
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu

      - name: Apply V8 base and resizable Input Settings
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 precision pointer and motion basis
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          git -C cemu diff --check
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $header = Get-Content "cemu\src\input\api\SDL\SDLController.h" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $inputSettings = Get-Content "cemu\src\gui\wxgui\input\InputSettings2.cpp" -Raw
          if ($provider.Contains("!config->second.vertical && !config->second.is_left")) { throw "V8 R Sideways double-transform still present" }
          if (-not $provider.Contains("V9 precision basis")) { throw "V9 common SDL motion basis missing" }
          if (-not $provider.Contains("motion_scale_x < 0.0f")) { throw "V9 physical IMU magnitude guard missing" }
          if (-not $controller.Contains("current_forward = attitude + 3")) { throw "3D pointing ray missing" }
          if (-not $controller.Contains("screen_horizontal = horizontal_angle")) { throw "V9 pointer horizontal direction missing" }
          if (-not $controller.Contains("screen_vertical = -vertical_angle")) { throw "V9 pointer vertical direction missing" }
          if (-not $header.Contains("m_pointer_smoothing{ 0.0f }")) { throw "V9 direct pointer default missing" }
          if (-not $header.Contains("m_pointer_deadzone_degrees{ 0.05f }")) { throw "V9 precision deadzone missing" }
          if (-not $wpad.Contains("joycon->update_joycon_pointer(position, previous)")) { throw "WPAD pointer delegation missing" }
          foreach ($marker in @("wxRESIZE_BORDER", "wxMAXIMIZE_BOX", "wxScrolledWindow", "SetScrollRate(0, 12)")) {
            if (-not $inputSettings.Contains($marker)) { throw "Resizable Input Settings marker missing: $marker" }
          }
          Write-Host "Verified V9 pointer direction, 3D ray, L/R SDL basis, physical IMU magnitude, and resizable UI."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V9
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @("Joy-Con L", "Joy-Con R", "Orientation:", "Pointer enabled", "Recenter pointer", "Motion calibration:", "Fast-forward ON (4x)")) {
            if (-not $ascii.Contains($marker)) { throw "Custom marker missing: $marker" }
          }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Precision V9
          =========================
          Upstream Cemu commit: $env:CEMU_COMMIT

          V9 changes over V8:
          - Keeps V8 fused 3D attitude pointing ray; no flat Euler/rate integrator.
          - Correct default pointer directions: physical right -> screen right, physical up -> screen up.
          - Direct pointer response by default (0 smoothing) with a tiny 0.05 degree deadzone.
          - Removes V8's extra Joy-Con R Sideways X/Z inversion; SDL already normalizes L/R mini-gamepad sensor orientation.
          - Preserves physical accelerometer/gyro magnitude 1:1; saved motion calibration can invert an axis but cannot distort 1 g / motion sensitivity.
          - Intended to restore natural Wii Remote tilt steering response in Mario Kart for both Joy-Con L and R.
          - Resizable/maximizable/scrollable Input Settings retained.
          - V8 pointer controls, orientation hotkeys, and Fast Forward retained.
          "@ | Set-Content "package\README-JoyCon-Precision-V9.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          $zip = "Cemu-JoyCon-Precision-V9-Windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "Final V9 ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Precision-V9-Windows-x64
          path: Cemu-JoyCon-Precision-V9-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
