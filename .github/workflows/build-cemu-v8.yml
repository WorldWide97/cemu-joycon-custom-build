name: Build Cemu Joy-Con Orientation V8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cemu-v8.yml"
      - "tools/apply_cemu_v8_motion_pointer_calibration.py"
      - "tools/apply_cemu_v8_postfix.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-cemu-v8.yml"
      - "tools/apply_cemu_v8_motion_pointer_calibration.py"
      - "tools/apply_cemu_v8_postfix.py"
      - "V8-BUILD-TRIGGER.txt"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1 verified prefix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core missing" }
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V7
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu

      - name: Apply V8 3D pointer and per-Joy-Con motion calibration
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          git -C cemu diff --check
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $header = Get-Content "cemu\src\input\api\SDL\SDLController.h" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          if (-not $provider.Contains("!config->second.vertical && !config->second.is_left")) { throw "V8 R Sideways normalization missing" }
          if (-not $provider.Contains("Preserve V8 per-device motion calibration")) { throw "V8 calibration preservation missing" }
          if (-not $controller.Contains("getVPADAttitudeMatrix(attitude)")) { throw "V8 3D attitude pointer missing" }
          if (-not $controller.Contains("current_forward = attitude + 3")) { throw "V8 pointing ray missing" }
          if (-not $wpad.Contains("joycon->update_joycon_pointer(position, previous)")) { throw "V8 WPAD pointer delegation missing" }
          foreach ($marker in @("Recenter pointer", "Motion calibration:", "Yaw °", "Pitch °", "Deadzone °", "Reset motion")) {
            if (-not $panel.Contains($marker)) { throw "V8 UI marker missing: $marker" }
          }
          Write-Host "Verified V8 source invariants."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V8
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @("Joy-Con L", "Joy-Con R", "Orientation:", "Pointer enabled", "Pointer hotkey", "Recenter pointer", "Motion calibration:", "Reset motion", "Fast-forward ON (4x)")) {
            if (-not $ascii.Contains($marker)) { throw "Custom V8 marker missing: $marker" }
            Write-Host "Verified marker: $marker"
          }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Orientation V8
          ===========================
          Upstream Cemu commit: $env:CEMU_COMMIT

          V8 hardware-calibration build:
          - Pointer uses the fused 3D attitude/pointing ray instead of Euler deltas or gyro-rate position integration.
          - Recenter stores the current controller aiming direction as screen center.
          - Controller roll does not define cursor left/right; pointing direction does.
          - Default pointer envelope follows Dolphin-style 25 degree yaw / 20 degree pitch and is user adjustable.
          - Per-Joy-Con pointer: enable, 2+ button toggle hotkey, recenter, yaw, pitch, deadzone, smoothing, invert X/Y.
          - Live pointer crosshair plus Gyro/Accel/Pointer readout in Wii Remote Input settings.
          - R Sideways IMU X/Z normalization based on SDL's actual Joy-Con mini-gamepad sensor transform.
          - Per-Joy-Con motion X/Y/Z gain and inversion settings with reset button, saved in profile.
          - Existing Vertical/Sideways orientation hotkeys, V6 control mapping, and Fast Forward retained.
          "@ | Set-Content "package\README-JoyCon-Orientation-V8.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          $zip = "Cemu-JoyCon-Orientation-V8-Windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "Final V8 ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Orientation-V8-Windows-x64
          path: Cemu-JoyCon-Orientation-V8-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
