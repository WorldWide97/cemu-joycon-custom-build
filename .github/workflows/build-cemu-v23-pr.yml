name: Build V23 Mario Kart KPAD Windows

on:
  pull_request:
    branches: [v23-ci-base]
    paths:
      - "V23-CI-TRIGGER.txt"
      - "tools/apply_cemu_v23_mario_kart_kpad.py"
      - ".github/workflows/build-cemu-v23-pr.yml"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply V15 V16 V21 V22 then isolate V23
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu

          $protected = @(
            "cemu\src\input\api\SDL\SDLControllerProvider.cpp",
            "cemu\src\input\api\SDL\SDLControllerProvider.h",
            "cemu\src\input\api\SDL\SDLController.cpp",
            "cemu\src\input\api\SDL\SDLController.h",
            "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp",
            "cemu\src\input\motion\MotionHandler.h",
            "cemu\src\input\motion\Mahony.h"
          )
          $before = @{}
          foreach ($file in $protected) { $before[$file] = (Get-FileHash $file -Algorithm SHA256).Hash }
          $wpadBefore = (Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash

          python wrapper\tools\apply_cemu_v23_mario_kart_kpad.py cemu
          git -C cemu diff --check

          foreach ($file in $protected) {
            $after = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($after -ne $before[$file]) { throw "V23 changed protected V22 subsystem: $file" }
          }
          $wpadAfter = (Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash
          if ($wpadAfter -eq $wpadBefore) { throw "V23 did not change WPADController.cpp" }

          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw

          foreach ($marker in @(
            "V22 hardware-driven motion basis",
            "V22: final Joy-Con R accelerometer",
            "tracking.acc.x = -tracking.acc.x;",
            "tracking.acc.z = -tracking.acc.z;"
          )) {
            if (-not $provider.Contains($marker)) { throw "V22 motion baseline lost: $marker" }
          }

          foreach ($marker in @(
            "V23: reconstruct the V16 KPAD down vector from V22's corrected",
            "status.accVertical.x = std::min(1.0f, std::abs(acc.z + acc.y))",
            "status.accVertical.y = std::min(std::max(-1.0f, acc.x), 1.0f)"
          )) {
            if (-not $wpad.Contains($marker)) { throw "V23 KPAD marker missing: $marker" }
          }

          foreach ($forbidden in @(
            "status.accVertical.x = std::min(1.0f, std::abs(acc.x + acc.y))",
            "status.accVertical.y = std::min(std::max(-1.0f, -acc.z), 1.0f)",
            "low-pass",
            "hysteresis",
            "steering_deadzone"
          )) {
            if ($wpad.Contains($forbidden)) { throw "V23 contains forbidden old/filter path: $forbidden" }
          }

          foreach ($marker in @(
            "Pointer Calibration Period (s)",
            "Game Gyro Calibration:",
            "Pointer Calibration:"
          )) {
            if (-not $panel.Contains($marker)) { throw "V21/V22 UI baseline lost: $marker" }
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V23
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Mario Kart KPAD V23
          =================================
          Base: hardware-approved V22.

          V23 changes exactly one runtime area: WPAD/KPAD accVertical reconstruction.
          - V22 general motion remains untouched.
          - Joy-Con L/R Sideways/Vertical remains untouched.
          - Joy-Con R final accelerometer 180-degree correction remains untouched.
          - Game Gyro calibration remains untouched.
          - Pointer and its calibration remain untouched.
          - Buttons/sticks remain untouched.
          - No steering deadzone, smoothing, low-pass filter or hysteresis is added.

          KPAD basis correction:
          V22 N = {-A.z, A.y, A.x}
          V16 down = {abs(A.x + A.y), -A.z}
          Therefore V23 down = {abs(N.z + N.y), N.x}

          Hardware test: Mario Kart Wii wheel steering only. Small natural steering movements should remain available.
          "@ | Set-Content "package\README-V23.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-JoyCon-Mario-Kart-KPAD-V23-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload V23 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Mario-Kart-KPAD-V23-Windows-x64
          path: Cemu-JoyCon-Mario-Kart-KPAD-V23-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
