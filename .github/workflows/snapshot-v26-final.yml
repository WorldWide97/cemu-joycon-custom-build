name: Snapshot Final V26 Input Source

on:
  push:
    branches: [wii-party-u-v32-pre1257-v26-input]
    paths:
      - ".github/workflows/snapshot-v26-final.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  snapshot:
    runs-on: windows-2022
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          ref: wii-party-u-v32-pre1257-v26-input
          path: wrapper
          fetch-depth: 0

      - name: Checkout pinned modern Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          fetch-depth: 1

      - name: Apply exact V26 stack
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $global:LASTEXITCODE = 0
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          python wrapper\tools\apply_cemu_v25_mario_kart_lr_mirror.py cemu Z
          python wrapper\tools\apply_cemu_v26_mario_kart_shortcut_semantics.py cemu
          git -C cemu diff --check

      - name: Copy final changed source snapshot
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue wrapper\generated\v26-final
          New-Item -ItemType Directory -Force wrapper\generated\v26-final | Out-Null
          $changed = @(git -C cemu diff --name-only -- src)
          $changed | Set-Content wrapper\generated\v26-final\MANIFEST.txt -Encoding utf8
          git -C cemu diff -- src | Set-Content wrapper\generated\v26-final\V26-FINAL.patch -Encoding utf8
          foreach ($rel in $changed) {
            $src = Join-Path cemu $rel
            if (Test-Path $src) {
              $dst = Join-Path wrapper\generated\v26-final $rel
              New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
              Copy-Item $src $dst -Force
            }
          }
          Write-Host "Changed source files: $($changed.Count)"
          $changed | ForEach-Object { Write-Host $_ }

      - name: Commit snapshot
        shell: pwsh
        working-directory: wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/v26-final
          if (git diff --cached --quiet) { Write-Host "Snapshot already current"; exit 0 }
          git commit -m "Capture final V26 input source snapshot"
          git push origin HEAD:wii-party-u-v32-pre1257-v26-input
