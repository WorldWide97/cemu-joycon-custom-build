name: Build V28 Wii Party U Legacy H264 Windows

on:
  push:
    branches: [wii-party-u-h264-v28-legacy]
    paths:
      - "tools/apply_cemu_v28_legacy_h264_cmake.py"
      - ".github/workflows/build-cemu-v28-wii-party-u-legacy-h264.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper V28
        uses: actions/checkout@v6
        with:
          ref: wii-party-u-h264-v28-legacy
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply hardware-approved V22 V25-Z and V26
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          python wrapper\tools\apply_cemu_v25_mario_kart_lr_mirror.py cemu Z
          python wrapper\tools\apply_cemu_v26_mario_kart_shortcut_semantics.py cemu
          git -C cemu diff --check

      - name: Replace modern H264 with exact 2.0-88 decoder
        shell: pwsh
        run: |
          $beforeWpad = (Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash
          $beforeProvider = (Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash
          $beforeController = (Get-FileHash "cemu\src\input\api\SDL\SDLController.cpp" -Algorithm SHA256).Hash

          git -C cemu fetch origin refs/tags/v2.0-88:refs/tags/v2.0-88 --depth=1
          git -C cemu checkout v2.0-88 -- src/Cafe/OS/libs/h264_avc/H264Dec.cpp src/Cafe/OS/libs/h264_avc/parser

          $legacyBlob = (git -C cemu hash-object src/Cafe/OS/libs/h264_avc/H264Dec.cpp).Trim()
          if ($legacyBlob -ne "024965fd0b0d10611c9fb6e0a08ecd399865ec49") { throw "Unexpected v2.0-88 H264Dec blob: $legacyBlob" }

          python wrapper\tools\apply_cemu_v28_legacy_h264_cmake.py cemu
          git -C cemu diff --check

          if ((Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash -ne $beforeWpad) { throw "V28 changed V26 WPAD motion math" }
          if ((Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash -ne $beforeProvider) { throw "V28 changed V26 motion provider" }
          if ((Get-FileHash "cemu\src\input\api\SDL\SDLController.cpp" -Algorithm SHA256).Hash -ne $beforeController) { throw "V28 changed V26 Mario Kart shortcut behavior" }

          $h264 = Get-Content "cemu\src\Cafe\OS\libs\h264_avc\H264Dec.cpp" -Raw
          foreach ($marker in @(
            "_async_H264DECExecute",
            "coreinit::OSWaitEvent(&executeDoneEvent);",
            "V28 compatibility bridge",
            "COSModule* GetModule()"
          )) {
            if (-not $h264.Contains($marker)) { throw "V28 legacy H264 marker missing: $marker" }
          }
          if ($h264.Contains("QueueForDecode")) { throw "Modern H264 decode-ahead leaked into V28" }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build V28 Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V28
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "V28 Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu V28 - Wii Party U Exact 2.0-88 H264 Regression Test
          =========================================================
          Base: hardware-approved V26.
          Current Cemu base: f6a8883d2913be1b0f06ef7065f1bf1fab800b43.

          Test purpose:
          - Wii Party U works on Cemu 2.0-88.
          - It crashes when selecting a game/mode on 2.0-89 and current builds.
          - V27 sync-only patch still crashed.
          - V28 replaces the modern split/queued H264 decoder with the exact
            H264Dec.cpp and parser from Cemu 2.0-88.
          - Only a thin COSModule registration bridge is added for compatibility
            with current Cemu's module loader.
          - V26 Joy-Con/Mario Kart/motion changes are preserved.

          Primary test: select the exact Wii Party U game/mode that previously crashes.
          "@ | Set-Content "package\README-V28.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-V28-Wii-Party-U-Exact-2.0-88-H264-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "V28 Cemu.exe SHA-256: $hash"

      - name: Upload V28 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-V28-Wii-Party-U-Exact-2.0-88-H264-Windows-x64
          path: Cemu-V28-Wii-Party-U-Exact-2.0-88-H264-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
