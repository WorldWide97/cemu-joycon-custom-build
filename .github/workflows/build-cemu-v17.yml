name: Build Cemu Joy-Con Direct Dolphin Motion V18

on:
  workflow_dispatch:
  push:
    branches: [v11-dolphin-wiimote-input]
    paths:
      - ".github/workflows/build-cemu-v17.yml"
      - "tools/apply_cemu_v15_r_sideways_kpad_wheel.py"
      - "tools/apply_cemu_v16_restore_v7_kpad_down.py"
      - "tools/apply_cemu_v17_physical_orientation_calibrated_gyro.py"
      - "tools/apply_cemu_v18_dolphin_game_motion.py"
      - "V18-BUILD-TRIGGER.txt"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
  DOLPHIN_REFERENCE_COMMIT: c77bbaa0f372c3f72281602a8b087206706542cb
  DOLPHIN_JOYCON_FIX_COMMIT: fb80816da78ff221456b9c880bf093d60219ebbc

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1 verified prefix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core missing" }
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V7
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu

      - name: Apply V8 UI and calibration base
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply and validate V15 through V18
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v17_physical_orientation_calibrated_gyro.py cemu
          python wrapper\tools\apply_cemu_v18_dolphin_game_motion.py cemu
          git -C cemu diff --check

          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $header = Get-Content "cemu\src\input\api\SDL\SDLController.h" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $panelHeader = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.h" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw

          foreach ($marker in @(
            "state.dolphin_pointer_acc = dolphin_acc",
            "state.dolphin_pointer_gyro = dolphin_gyro",
            "glm::vec3 game_acc = dolphin_acc",
            "V18 game motion is the calibrated Dolphin semantic stream",
            "state.handler.processDolphinMotionSample(tsDifD"
          )) {
            if (-not $provider.Contains($marker)) { throw "V18 direct Dolphin game-motion marker missing: $marker" }
          }
          if ($provider.Contains("Game motion is deliberately NOT Dolphin-oriented")) {
            throw "V14 V9/raw game-motion routing remains"
          }
          foreach ($marker in @(
            "V17: KPAD down/accVertical is a signed vector.",
            "status.accVertical.x = std::clamp(acc.x + acc.y, -1.0f, 1.0f)",
            "status.accVertical.y = std::clamp(-acc.z, -1.0f, 1.0f)"
          )) {
            if (-not $wpad.Contains($marker)) { throw "V17 signed KPAD down marker missing: $marker" }
          }
          if ($wpad.Contains("std::abs(acc.x + acc.y)") -or $wpad.Contains("const float down_horizontal")) {
            throw "Unsigned KPAD down calculation remains"
          }
          foreach ($marker in @(
            "get_dolphin_total_yaw_degrees",
            "get_dolphin_accel_influence",
            "m_dolphin_pointer_sensor_target",
            "time_constant = 0.0025f + smoothing * 0.10f"
          )) {
            if (-not ($controller.Contains($marker) -or $header.Contains($marker))) { throw "V17 pointer marker missing: $marker" }
          }
          if ($panel.Contains('_("Pointer...")') -or $panelHeader.Contains("m_joycon_pointer_dialog")) {
            throw "External Pointer button returned"
          }
          foreach ($marker in @(
            "Motion Input...",
            "Point and motion settings are combined in one Dolphin-style window.",
            "Motion Input - Dolphin Wii Remote",
            "Point (Passthrough)",
            "R Sideways = hardware-verified 180 degree fix",
            "Dead Zone (degrees/s)",
            "Calibration Period (s)"
          )) {
            if (-not $panel.Contains($marker)) { throw "V17 UI marker missing: $marker" }
          }
          foreach ($marker in @(
            "dolphin_game_gyro_bias",
            "raw_game_gyro",
            "restart_game_calibration",
            "tracking.gyro = game_gyro"
          )) {
            if (-not $provider.Contains($marker) -and -not $header.Contains($marker)) { throw "V17 calibrated game gyro marker missing: $marker" }
          }
          foreach ($marker in @(
            "V17: labels now match the physical transform they select.",
            "GetSelection() == 1 ? SDLController::JoyConOrientation::Vertical : SDLController::JoyConOrientation::Sideways",
            "orientation->GetSelection() == 1 ?"
          )) {
            if (-not $panel.Contains($marker)) { throw "V17 physical orientation marker missing: $marker" }
          }
          foreach ($marker in @(
            "const bool physical_vertical = orientation == JoyConOrientation::Vertical;",
            "const bool physical_vertical = get_joycon_orientation() == JoyConOrientation::Vertical;",
            "set_joycon_orientation(JoyConOrientation::Vertical);",
            "if (get_joycon_orientation() == JoyConOrientation::Vertical)",
            "joycon_orientation_v17",
            "profiles stored the inverse enum"
          )) {
            if (-not $controller.Contains($marker)) { throw "V17 actual physical transform marker missing: $marker" }
          }
          Write-Host "Verified V18 source: direct calibrated Dolphin game motion, signed KPAD steering, truthful orientation, and independent pointer."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V18
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            "Joy-Con L",
            "Joy-Con R",
            "Motion Input...",
            "Point (Passthrough)",
            "R Sideways = hardware-verified 180 degree fix",
            "Total Yaw",
            "Horizontal FOV",
            "Calibration Period (s)",
            "Dolphin-style input:",
            "Fast-forward ON (4x)"
          )) {
            if (-not $ascii.Contains($marker)) { throw "Custom executable marker missing: $marker" }
          }
          if ($ascii.Contains("Pointer...")) { throw "External Pointer button marker remains in executable" }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Direct Dolphin Motion V18
          =================================
          Upstream Cemu: $env:CEMU_COMMIT
          Dolphin pointer reference: $env:DOLPHIN_REFERENCE_COMMIT (2606a)
          User-tested Dolphin Joy-Con fix reference: $env:DOLPHIN_JOYCON_FIX_COMMIT

          V18 changes over V17:
          - Routes actual Joy-Con game motion through calibrated Dolphin semantic accelerometer and gyroscope axes.
          - Pointer remains pre-orientation; KPAD/MotionPlus alone receives L Sideways -90 degree and R Sideways 180 degree postfixes.
          - Keeps signed KPAD down-vector for left/right steering and preserves profile orientation migration.
          - Preserves the independent Dolphin pointer, calibration, smoothing, recenter, and live indicators.
          - Keeps the external Pointer... button removed and preserves all Point controls inside Motion Input....

          Recommended pointer start: Deadzone 0.35 degrees, Smooth 0.10.
          Hardware motion behavior still requires real Joy-Con testing in Mario Kart and Mario Party.
          "@ | Set-Content "package\README-JoyCon-Dolphin-WiiRemote-V18.txt" -Encoding utf8

          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          $zip = "Cemu-JoyCon-Dolphin-WiiRemote-V18-Windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "Final V18 ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Dolphin-WiiRemote-V18-Windows-x64
          path: Cemu-JoyCon-Dolphin-WiiRemote-V18-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
