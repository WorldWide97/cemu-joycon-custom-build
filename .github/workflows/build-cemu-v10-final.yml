name: Build Cemu Joy-Con Dolphin Motion V10 Final

on:
  workflow_dispatch:
  push:
    branches: [v10-dolphin-motion-core]
    paths:
      - ".github/workflows/build-cemu-v10-final.yml"
      - "tools/apply_cemu_v10_dolphin_motion_core.py"
      - "tools/apply_cemu_v10_dolphin_postfix.py"
      - "V10-FINAL-BUILD-TRIGGER.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-cemu-v10-final.yml"
      - "tools/apply_cemu_v10_dolphin_motion_core.py"
      - "tools/apply_cemu_v10_dolphin_postfix.py"
      - "V10-FINAL-BUILD-TRIGGER.txt"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
  DOLPHIN_REFERENCE_COMMIT: c77bbaa0f372c3f72281602a8b087206706542cb
  DOLPHIN_JOYCON_FIX_COMMIT: fb80816da78ff221456b9c880bf093d60219ebbc

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1 verified prefix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core missing" }
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V7
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu

      - name: Apply V8 UI and calibration base
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 compatibility layer
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu

      - name: Apply Dolphin 2606a V10 core and final fixes
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          git -C cemu diff --check

          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $providerHeader = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.h" -Raw
          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $header = Get-Content "cemu\src\input\api\SDL\SDLController.h" -Raw
          $motion = Get-Content "cemu\src\input\motion\MotionHandler.h" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $inputSettings = Get-Content "cemu\src\gui\wxgui\input\InputSettings2.cpp" -Raw

          foreach ($marker in @(
            "kDolphinGyroDeadzone",
            "kDolphinCalibrationPeriodNs = 3000000000ULL",
            "kDolphinMinCalibrationHz = 25.0",
            "dolphin_pointer_motion",
            "dolphin_pointer_gyro",
            "dolphin_pointer_acc"
          )) {
            if (-not ($provider.Contains($marker) -or $providerHeader.Contains($marker))) {
              throw "V10 Dolphin motion marker missing: $marker"
            }
          }

          foreach ($marker in @(
            "kDolphinAccelInfluence = 0.01f",
            "kDolphinTotalYaw = 25.0f",
            "kDolphinVerticalFov = 31.5f",
            "m_dolphin_pointer_rotation",
            "m_dolphin_recentered_pitch",
            "q_axis_angle(gyro * -dt)"
          )) {
            if (-not ($controller.Contains($marker) -or $header.Contains($marker))) {
              throw "V10 Dolphin pointer marker missing: $marker"
            }
          }

          if ($controller.Contains("current_forward = attitude + 6")) { throw "V9 attitude-ray pointer still active" }
          if ($controller.Contains("m_joycon_pointer_reference_attitude")) { throw "V9 pointer reference matrix still active" }

          # Exact orientation behavior from the known-good Dolphin setup.
          if (-not $provider.Contains("v10_left_sideways")) { throw "Dolphin L Sideways -90 path missing" }
          if (-not $provider.Contains("dolphin_acc.x = dolphin_acc.y")) { throw "Dolphin L accel -90 transform missing" }
          if (-not $provider.Contains("dolphin_gyro.x = dolphin_gyro.y")) { throw "Dolphin L gyro -90 transform missing" }
          if (-not $provider.Contains("v10_right_sideways")) { throw "Dolphin R Sideways 180 path missing" }
          if (-not $provider.Contains("dolphin_acc.x = -dolphin_acc.x")) { throw "Dolphin R accel 180 transform missing" }
          if (-not $provider.Contains("dolphin_gyro.x = -dolphin_gyro.x")) { throw "Dolphin R gyro 180 transform missing" }

          # Dolphin calibration must not be followed by a second Cemu bias subtraction.
          foreach ($marker in @("processDolphinMotionSample", "m_gyroAlreadyCalibrated", "if (m_gyroAlreadyCalibrated)")) {
            if (-not $motion.Contains($marker)) { throw "Dolphin calibrated motion bypass missing: $marker" }
          }
          if (-not $provider.Contains("state.handler.processDolphinMotionSample")) { throw "Joy-Con not routed through calibrated Dolphin path" }

          if (-not $wpad.Contains("joycon->update_joycon_pointer(position, previous)")) { throw "WPAD pointer delegation missing" }
          foreach ($marker in @("wxRESIZE_BORDER", "wxMAXIMIZE_BOX", "wxScrolledWindow", "SetScrollRate(0, 12)")) {
            if (-not $inputSettings.Contains($marker)) { throw "Resizable Input Settings marker missing: $marker" }
          }

          Write-Host "Verified V10 final: Dolphin 2606a IMU cursor, 1% accel influence, 3s/2deg gyro calibration, L -90, R 180, and no double Cemu gyro bias."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V10 final
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @("Joy-Con L", "Joy-Con R", "Orientation:", "Pointer enabled", "Recenter pointer", "Motion calibration:", "Fast-forward ON (4x)")) {
            if (-not $ascii.Contains($marker)) { throw "Custom executable marker missing: $marker" }
          }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Dolphin Motion V10 FINAL
          =====================================
          Upstream Cemu: $env:CEMU_COMMIT
          Exact Dolphin behavior reference: $env:DOLPHIN_REFERENCE_COMMIT (2606a)
          User-tested Dolphin Joy-Con fix: $env:DOLPHIN_JOYCON_FIX_COMMIT

          Motion / pointer baseline comes from the supplied known-good Dolphin setup:
          - User Dolphin SDL setting matched: VERTICAL_JOY_CONS=1 and COMBINE_JOY_CONS=0.
          - Dolphin semantic IMU axes are reconstructed from Cemu's independent SDL mini-gamepad Joy-Cons.
          - Gyro calibration matches Dolphin: stable 3-second mean, 2 deg/s deadzone, >=25 Hz stability requirement.
          - The already-calibrated gyro bypasses Cemu's second bias subtraction.
          - Pointer uses Dolphin EmulateIMUCursor-style quaternion integration.
          - Pointer accelerometer influence is 1%, matching the supplied Wiimote profiles.
          - Pointer Total Yaw is 25 degrees; vertical camera envelope is 31.5 degrees.
          - Pointer Recenter preserves Dolphin's pitch/yaw semantics and remains independent of Wii Remote Sideways orientation.
          - Joy-Con L Sideways uses stock Dolphin -90-degree Z orientation.
          - Joy-Con R Sideways uses the user's proven custom 180-degree Z orientation.
          - Vertical L/R use the native Dolphin Joy-Con sensor frame.
          - V9 attitude-ray pointer is removed from the active runtime path.
          - Resizable/maximizable/scrollable Input Settings and prior Joy-Con controls are retained.

          This is a Cemu WPAD/KPAD adapter for Dolphin behavior, not a literal Dolphin binary transplant.
          "@ | Set-Content "package\README-JoyCon-DolphinMotion-V10-FINAL.txt" -Encoding utf8

          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          $zip = "Cemu-JoyCon-DolphinMotion-V10-FINAL-Windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "Final V10 ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-DolphinMotion-V10-FINAL-Windows-x64
          path: Cemu-JoyCon-DolphinMotion-V10-FINAL-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
