name: Build V33 PRE-1257 + V26 Runtime Backport

on:
  push:
    branches: [wii-party-u-v33-pre1257-v26-backport]
    paths:
      - ".github/workflows/build-cemu-v33-pre1257-v26-backport.yml"
      - "generated/v26-final/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  PRE1257_COMMIT: 4b9c7c0d307495c679127381d6f00bab9f0c2933

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper V33
        uses: actions/checkout@v6
        with:
          ref: wii-party-u-v33-pre1257-v26-backport
          path: wrapper

      - name: Checkout exact PRE-1257 Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: 4b9c7c0d307495c679127381d6f00bab9f0c2933
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact Wii Party U known-good base
        shell: pwsh
        run: |
          $head = (git -C cemu rev-parse HEAD).Trim()
          if ($head -ne $env:PRE1257_COMMIT) { throw "Wrong Cemu base: $head" }
          $h264 = (git -C cemu hash-object src/Cafe/OS/libs/h264_avc/H264Dec.cpp).Trim()
          if ($h264 -ne "024965fd0b0d10611c9fb6e0a08ecd399865ec49") { throw "PRE H264 mismatch: $h264" }
          Write-Host "Exact PRE-1257 base verified: $head"

      - name: Generate manual V26 runtime backport for PRE SDL2
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v33_pre1257_v26_runtime.py cemu --wrapper wrapper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "--- V33 RUNTIME BACKPORT DIFF ---"
          git -C cemu status --short
          git -C cemu diff --check

      - name: Verify V26 runtime core and isolation
        shell: pwsh
        run: |
          $required = @(
            "src/input/api/SDL/SDLController.cpp",
            "src/input/api/SDL/SDLController.h",
            "src/input/api/SDL/SDLControllerProvider.cpp",
            "src/input/api/SDL/SDLControllerProvider.h",
            "src/input/emulated/WPADController.cpp",
            "src/input/emulated/WPADController.h",
            "src/input/motion/Mahony.h",
            "src/input/motion/MotionHandler.h"
          )
          $changed = @(git -C cemu diff --name-only HEAD)
          foreach ($file in $required) {
            if ($changed -notcontains $file) { throw "Runtime backport file missing from diff: $file" }
          }
          if ($changed.Count -ne $required.Count) {
            Write-Host "Changed files:"; $changed | ForEach-Object { Write-Host $_ }
            throw "Diagnostic isolation violated: expected exactly $($required.Count) runtime files, got $($changed.Count)"
          }
          $provider = Get-Content cemu\src\input\api\SDL\SDLControllerProvider.cpp -Raw
          $controller = Get-Content cemu\src\input\api\SDL\SDLController.cpp -Raw
          $wpad = Get-Content cemu\src\input\emulated\WPADController.cpp -Raw
          if ($provider -notmatch "dolphin_pointer_motion") { throw "V26 pointer provider missing" }
          if ($provider -notmatch "processCalibratedMotionSample") { throw "V26 calibrated Joy-Con path missing" }
          if ($controller -notmatch "joycon_pointer_calibration_period_s") { throw "V26 profile compatibility missing" }
          if ($controller -notmatch "V26: V5's legacy hotkey swap") { throw "V26 hotkey semantics missing" }
          if ($wpad -notmatch "update_joycon_pointer") { throw "V26 WPAD pointer path missing" }
          if ($provider -match "SDL3/" -or $controller -match "SDL3/") { throw "SDL3 include leaked into PRE build" }
          Write-Host "V26 runtime core present; GUI/LatteTiming intentionally excluded from this diagnostic."

      - name: Verify PRE H264 stayed byte-identical
        shell: pwsh
        run: |
          $h264 = (git -C cemu hash-object src/Cafe/OS/libs/h264_avc/H264Dec.cpp).Trim()
          if ($h264 -ne "024965fd0b0d10611c9fb6e0a08ecd399865ec49") { throw "Backport touched PRE H264 core: $h264" }
          if (Test-Path "cemu\src\Cafe\OS\libs\h264_avc\H264DecBackendAVC.cpp") { throw "Post-1257 H264 backend unexpectedly exists" }
          if (Test-Path "cemu\src\Cafe\OS\libs\h264_avc\H264DecInternal.h") { throw "Post-1257 H264 internal header unexpectedly exists" }
          Write-Host "PRE-1257 H264 core preserved byte-for-byte."

      - name: Replace historical vcpkg toolchain only
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force cemu\dependencies\vcpkg
          git clone https://github.com/microsoft/vcpkg.git cemu\dependencies\vcpkg
          git -C cemu\dependencies\vcpkg checkout 2026.07.29
          $baseline = "a4275b7eee79fb24ec2e135481ef5fce8b41c339"
          git -C cemu\dependencies\vcpkg fetch origin $baseline
          git -C cemu\dependencies\vcpkg rev-parse $baseline
          Get-Content cemu\vcpkg.json | Select-String "builtin-baseline"

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build V33 Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V33 runtime diagnostic
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "V33 Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu V33 - PRE-1257 Wii Party U Core + V26 Runtime Core
          =======================================================
          Base: exact known-good PRE-1257 commit 4b9c7c0d307495c679127381d6f00bab9f0c2933
          H264Dec.cpp: byte-identical to PRE-1257.
          V26 runtime backport: SDL Joy-Con engine, profile state/hotkeys, Dolphin pointer,
          WPAD/KPAD integration, Mahony/calibrated motion.
          SDL3 V26 input code is manually adapted to PRE's SDL2 APIs and millisecond timestamps.
          GUI/LatteTiming are intentionally NOT in this diagnostic build yet.

          Test by replacing only Cemu.exe inside the existing V26 portable folder.
          Keep controller profiles/settings/mlc01 unchanged so the V26 XML profile values are reused.
          "@ | Set-Content "package\README-V33.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-V33-PRE1257-V26-Runtime-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "V33 SHA-256: $hash"

      - name: Upload V33 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-V33-PRE1257-V26-Runtime-Windows-x64
          path: Cemu-V33-PRE1257-V26-Runtime-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
