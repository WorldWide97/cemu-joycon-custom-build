name: Build V26 Mario Kart Sideways Shortcut Windows

on:
  pull_request:
    branches: [v26-ci-base]
    paths:
      - "V26-CI-TRIGGER.txt"
      - "tools/apply_cemu_v26_mario_kart_shortcut_semantics.py"
      - ".github/workflows/build-cemu-v26-pr.yml"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply hardware-approved V22 and V25-Z, then isolate V26
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          python wrapper\tools\apply_cemu_v25_mario_kart_lr_mirror.py cemu Z
          git -C cemu diff --check

          $wpadBefore = (Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash
          $providerBefore = (Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash
          $panelBefore = (Get-FileHash "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Algorithm SHA256).Hash
          $motionBefore = (Get-FileHash "cemu\src\input\motion\MotionHandler.h" -Algorithm SHA256).Hash

          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          foreach ($marker in @(
            'V25-Z: single-axis steering mirror',
            'if (joycon_left && !joycon_right)',
            'acc.z = -acc.z;',
            'acc.x = acc.z;',
            'acc.z = -pre_quarter_x;'
          )) {
            if (-not $wpad.Contains($marker)) { throw "V25-Z marker missing before V26: $marker" }
          }

          function Get-SourceHashes {
            $srcRoot = (Resolve-Path "cemu\src").Path
            $map = @{}
            Get-ChildItem $srcRoot -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($srcRoot.Length + 1)
              $map[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }
            return $map
          }

          $before = Get-SourceHashes
          python wrapper\tools\apply_cemu_v26_mario_kart_shortcut_semantics.py cemu
          git -C cemu diff --check
          $after = Get-SourceHashes
          $changed = @($before.Keys | Where-Object { -not $after.ContainsKey($_) -or $before[$_] -ne $after[$_] })
          $expected = "input\api\SDL\SDLController.cpp"
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "V26 isolation failure. Expected only $expected from V25-Z; changed: $($changed -join ', ')"
          }

          if ((Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash -ne $wpadBefore) { throw "V26 changed hardware-approved V25-Z KPAD math" }
          if ((Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash -ne $providerBefore) { throw "V26 changed V22 motion provider" }
          if ((Get-FileHash "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Algorithm SHA256).Hash -ne $panelBefore) { throw "V26 changed orientation UI" }
          if ((Get-FileHash "cemu\src\input\motion\MotionHandler.h" -Algorithm SHA256).Hash -ne $motionBefore) { throw "V26 changed motion handler" }

          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          foreach ($marker in @(
            "V26: V5's legacy hotkey swap",
            'TitleIdParser::MakeBaseTitleId(CafeSystem::GetForegroundTitleId())',
            'v26_mario_kart_8 ? JoyConOrientation::Sideways : JoyConOrientation::Vertical',
            'v26_mario_kart_8 ? JoyConOrientation::Vertical : JoyConOrientation::Sideways'
          )) {
            if (-not $controller.Contains($marker)) { throw "V26 controller marker missing: $marker" }
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build V26 Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V26
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "V26 Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Mario Kart V26
          ============================
          Runtime base: hardware-approved V22 + hardware-approved V25-Z.

          Hardware result preserved:
          - Mario Kart 8 Joy-Con L = 100%.
          - Mario Kart 8 Joy-Con R = 100%.
          - Steering left/right = correct.
          - Natural horizontal grip = correct.
          - MotionPlus must remain OFF.

          V26 changes ONLY shortcut semantics while Mario Kart 8 is foreground:
          - Sideways hotkey -> internal Sideways.
          - Vertical hotkey -> internal Vertical.
          - OSD reports the same 1:1 name.
          - Other titles retain V22/V5 shortcut behavior unchanged.
          - V25-Z WPADController.cpp is byte-identical before and after V26.
          - No KPAD math, motion provider, gyro, pointer, calibration, buttons, sticks,
            or Wiimote Input panel changes are made by V26.

          Test:
          1) MotionPlus OFF.
          2) Launch Mario Kart 8.
          3) Press your configured Sideways shortcut.
          4) Hold either Joy-Con naturally horizontally and verify the same 100% V25-Z steering.
          "@ | Set-Content "package\README-V26.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-JoyCon-Mario-Kart-V26-Sideways-Shortcut-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "V26 Cemu.exe SHA-256: $hash"

      - name: Upload V26 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Mario-Kart-V26-Sideways-Shortcut-Windows-x64
          path: Cemu-JoyCon-Mario-Kart-V26-Sideways-Shortcut-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
