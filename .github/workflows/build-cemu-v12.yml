name: Build Cemu Joy-Con Dolphin Motion Visualizer V12

on:
  workflow_dispatch:
  push:
    branches: [v11-dolphin-wiimote-input]
    paths:
      - ".github/workflows/build-cemu-v12.yml"
      - "tools/apply_cemu_v12_dolphin_motion_visualizer.py"
      - "V12-BUILD-TRIGGER.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-cemu-v12.yml"
      - "tools/apply_cemu_v12_dolphin_motion_visualizer.py"
      - "V12-BUILD-TRIGGER.txt"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
  DOLPHIN_REFERENCE_COMMIT: c77bbaa0f372c3f72281602a8b087206706542cb
  DOLPHIN_JOYCON_FIX_COMMIT: fb80816da78ff221456b9c880bf093d60219ebbc

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1 verified prefix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core missing" }
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V7
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu

      - name: Apply V8 UI and calibration base
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 compatibility layer
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu

      - name: Apply V10 Dolphin motion core
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu

      - name: Apply V11 Dolphin Wii Remote input
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu

      - name: Apply and validate V12
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          git -C cemu diff --check

          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $header = Get-Content "cemu\src\input\api\SDL\SDLController.h" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $providerHeader = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.h" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw

          foreach ($marker in @(
            "m_dolphin_pointer_target",
            "m_dolphin_pointer_last_output_timestamp",
            "m_dolphin_pointer_sensor_target",
            "target - m_dolphin_pointer_target",
            "time_constant = 0.0025f + smoothing * 0.10f",
            "std::exp(-output_dt / time_constant)",
            "joycon_pointer_recenter_hotkey"
          )) {
            if (-not ($controller.Contains($marker) -or $header.Contains($marker))) { throw "V12 pointer marker missing: $marker" }
          }

          foreach ($marker in @(
            "DolphinMotionDebug",
            "dolphin_calibration_stable",
            "dolphin_calibration_complete",
            "tracking.acc *= scale",
            "tracking.gyro *= scale",
            "kDolphinCalibrationPeriodNs = 3000000000ULL",
            "kDolphinMinCalibrationHz = 25.0"
          )) {
            if (-not ($provider.Contains($marker) -or $providerHeader.Contains($marker))) { throw "V12 motion marker missing: $marker" }
          }

          if ($wpad.Contains("std::abs(acc.x + acc.y)")) { throw "Unsigned KPAD down-vector bug returned" }
          if (-not $wpad.Contains("status.accVertical.x = std::clamp(acc.x + acc.y, -1.0f, 1.0f)")) {
            throw "Signed KPAD down-vector fix missing"
          }

          foreach ($marker in @(
            "Pointer - Dolphin Motion",
            "Motion Input - Dolphin Wii Remote",
            "yellow = sensor, blue = deadzone target, green = smoothed game output",
            "KEEP STILL",
            "READY / STILL",
            "3 second timer restarted",
            "Recenter shortcut:",
            "Internal Vertical means physical Sideways"
          )) {
            if (-not $panel.Contains($marker)) { throw "V12 live UI marker missing: $marker" }
          }

          if (-not $panel.Contains("JoyConOrientation::Vertical ? 0 : 1")) {
            throw "V12 physical Sideways/Vertical dialog mapping fix missing"
          }

          Write-Host "Verified V12 source: live visualizers, correct physical orientation UI, applied motion scale, Dolphin stillness calibration status, smoother pointer anchor, and manual recenter shortcut."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V12
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            "Joy-Con L",
            "Joy-Con R",
            "Pointer...",
            "Motion Input...",
            "Deadzone (degrees)",
            "Recenter shortcut:",
            "KEEP STILL",
            "Dolphin-style input:",
            "Fast-forward ON (4x)"
          )) {
            if (-not $ascii.Contains($marker)) { throw "Custom executable marker missing: $marker" }
          }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Dolphin Motion Visualizer V12
          =========================================
          Upstream Cemu: $env:CEMU_COMMIT
          Dolphin motion reference: $env:DOLPHIN_REFERENCE_COMMIT (2606a)
          User-tested Joy-Con R fix: $env:DOLPHIN_JOYCON_FIX_COMMIT

          V12 changes over V11:
          - Fixes V11's reversed physical Sideways/Vertical selection in the Motion Input dialog.
          - Actually applies the saved per-axis motion scale and inversion to both accelerometer and gyroscope.
          - Adds a live Dolphin-style motion view with gravity/tilt, gyro axes, sample rate and calibration progress.
          - Keeps Dolphin's 3 s stable mean, 2 deg/s deadzone and >=25 Hz restart rules.
          - Stillness updates gyro bias only and never auto-recenters the pointer.
          - Adds a dedicated configurable manual pointer recenter shortcut, including one-button shortcuts.
          - Keeps the older independent pointer ON/OFF shortcut.
          - Adds a live pointer view: raw sensor target, deadzone target and smoothed game output.
          - Separates the pointer deadzone anchor from smoothing feedback to reduce cutting/stutter.
          - Preserves V10 pointer geometry/quaternion fusion and V11 signed KPAD down vector.

          Recommended pointer start: Deadzone 0.35 degrees, Smooth 0.10.
          Hardware motion behavior still requires real Joy-Con testing.
          "@ | Set-Content "package\README-JoyCon-Dolphin-WiiRemote-V12.txt" -Encoding utf8

          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          $zip = "Cemu-JoyCon-Dolphin-WiiRemote-V12-Windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "Final V12 ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Dolphin-WiiRemote-V12-Windows-x64
          path: Cemu-JoyCon-Dolphin-WiiRemote-V12-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
