name: Build Cemu Joy-Con Physical Gyro V19

on:
  workflow_dispatch:
  push:
    branches: [v19-from-v16]
    paths:
      - ".github/workflows/build-cemu-v19.yml"
      - "tools/apply_cemu_v19_physical_joycon_gyro.py"
      - "V19-BUILD-TRIGGER.txt"

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
  DOLPHIN_REFERENCE_COMMIT: c77bbaa0f372c3f72281602a8b087206706542cb
  DOLPHIN_JOYCON_FIX_COMMIT: fb80816da78ff221456b9c880bf093d60219ebbc

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1 verified prefix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core missing" }
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V7
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu

      - name: Apply V8 UI and calibration base
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply V15 V16 and gyro-only V19
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v19_physical_joycon_gyro.py cemu
          git -C cemu diff --check

          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $header = Get-Content "cemu\src\input\api\SDL\SDLController.h" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $panelHeader = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.h" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw

          # V16 must remain intact outside the gyro assignment.
          foreach ($marker in @(
            "V15 hardware-proven Joy-Con R Sideways correction",
            "V16 restores the exact V7/upstream Cemu KPAD down contract",
            "status.accVertical.x = std::min(1.0f, std::abs(acc.x + acc.y))",
            "status.accVertical.y = std::min(std::max(-1.0f, -acc.z), 1.0f)",
            "state.handler.processMotionSample(tsDifD",
            "state.dolphin_pointer_acc = dolphin_acc",
            "state.dolphin_pointer_gyro = dolphin_gyro"
          )) {
            if (-not ($provider.Contains($marker) -or $wpad.Contains($marker))) { throw "V16 baseline marker missing: $marker" }
          }

          # V19 changes game gyro only: use side-normalized native/Dolphin semantic
          # gyro, then apply the known Sideways presentation rotations.
          foreach ($marker in @(
            "V19 gyro-only fix: use the physical/native Joy-Con gyro basis",
            "glm::vec3 game_gyro = raw_gyro",
            "Stock Dolphin Joy-Con L Sideways orientation: RotateZ(-90)",
            "game_gyro.x = game_gyro.y",
            "game_gyro.y = -old_x",
            "User/hardware-proven Joy-Con R Sideways orientation: RotateZ(180)",
            "game_gyro.x = -game_gyro.x",
            "game_gyro.y = -game_gyro.y",
            "tracking.gyro = game_gyro"
          )) {
            if (-not $provider.Contains($marker)) { throw "V19 physical gyro marker missing: $marker" }
          }

          if ($provider.Contains("// Exact V9 gyro basis for games.")) { throw "Old V9 raw game gyro assignment remains" }
          if ($provider.Contains("V18 game motion is the calibrated Dolphin semantic stream")) { throw "V18 game-motion routing leaked into V19" }
          if ($provider.Contains("glm::vec3 game_acc = dolphin_acc")) { throw "V19 must not alter V16 accelerometer routing" }
          if ($provider.Contains("dolphin_game_gyro_bias")) { throw "V17 game-gyro calibration leaked into V19" }
          if ($provider.Contains("state.handler.processDolphinMotionSample(tsDifD")) { throw "V19 must preserve V16 Cemu MotionHandler game path" }

          foreach ($marker in @(
            "get_dolphin_total_yaw_degrees",
            "get_dolphin_accel_influence",
            "m_dolphin_pointer_sensor_target",
            "time_constant = 0.0025f + smoothing * 0.10f"
          )) {
            if (-not ($controller.Contains($marker) -or $header.Contains($marker))) { throw "V16 pointer marker missing: $marker" }
          }
          if ($panel.Contains('_("Pointer...")') -or $panelHeader.Contains("m_joycon_pointer_dialog")) { throw "External Pointer button returned" }

          Write-Host "Verified V19: V16 baseline untouched except game gyro; physical L/R gyro mapping active; no V17/V18 routing."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V19
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            "Joy-Con L",
            "Joy-Con R",
            "Motion Input...",
            "Point (Passthrough)",
            "R Sideways = hardware-verified 180 degree fix",
            "Total Yaw",
            "Horizontal FOV",
            "Calibration Period (s)",
            "Dolphin-style input:",
            "Fast-forward ON (4x)"
          )) {
            if (-not $ascii.Contains($marker)) { throw "Custom executable marker missing: $marker" }
          }
          if ($ascii.Contains("Pointer...")) { throw "External Pointer button marker remains in executable" }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Physical Gyro V19 (V16 baseline)
          =================================================
          Upstream Cemu: $env:CEMU_COMMIT
          Base project version: V16 commit c78d7ce9f4cd4dd247acbe57e495d1b92c8eb6a1
          Dolphin motion reference: $env:DOLPHIN_REFERENCE_COMMIT (2606a)
          User-tested Dolphin Joy-Con orientation reference: $env:DOLPHIN_JOYCON_FIX_COMMIT

          V19 changes over V16:
          - Gyroscope only. V16 accelerometer, exact V7 KPAD/down contract, pointer, UI, buttons, and fast-forward are unchanged.
          - Reconstructs each standalone Joy-Con's physical/native gyro axes instead of treating SDL mini-gamepad X/Y/Z as identical for L and R.
          - Uses the known Dolphin semantic pitch/roll/yaw basis for the game gyro.
          - Joy-Con L Sideways receives the stock Dolphin -90 degree Z orientation.
          - Joy-Con R Sideways receives the hardware-proven 180 degree Z orientation.
          - Vertical L/R use their normalized native Joy-Con gyro frame.
          - Keeps Cemu's normal game MotionHandler bias/filter path; pointer calibration remains independent.
          - Does NOT include V17 game-gyro calibration or V18 Dolphin game-motion/accelerometer routing.

          Test first with the same V16 controller profile. Compare pitch, roll and yaw on both Joy-Con L and R in Vertical and Sideways.
          "@ | Set-Content "package\README-JoyCon-Dolphin-WiiRemote-V19.txt" -Encoding utf8

          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          $zip = "Cemu-JoyCon-Dolphin-WiiRemote-V19-Windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "Final V19 ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Dolphin-WiiRemote-V19-Windows-x64
          path: Cemu-JoyCon-Dolphin-WiiRemote-V19-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
