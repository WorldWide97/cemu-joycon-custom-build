name: Build Cemu Joy-Con Orientation V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cemu-v6.yml"
      - "tools/apply_cemu_sideways.py"
      - "tools/apply_cemu_v3_detection_fix.py"
      - "tools/apply_cemu_v4_motion_osd.py"
      - "tools/apply_cemu_v5_pointer_orientation_fastforward.py"
      - "tools/apply_cemu_v5_stage2_pointer_kpad_fastforward.py"
      - "tools/apply_cemu_v6_input_coordinates_pointer.py"
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 core
        shell: pwsh
        run: python wrapper\tools\apply_cemu_sideways.py cemu

      - name: Apply V3 detection
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v3_detection_fix.py cemu

      - name: Apply V4 motion and OSD
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1 verified prefix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core missing" }
          if (-not $provider.Contains("!config->second.is_left && config->second.vertical")) { throw "V5 motion prefix missing" }
          if (-not $panel.Contains("Internal Vertical == physical Sideways")) { throw "V5 UI mapping missing" }
          if (-not $controller.Contains('orientation == JoyConOrientation::Vertical ? "Sideways" : "Vertical"')) { throw "V5 OSD mapping missing" }
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing with Stage 2." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 stage 2
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu

      - name: Apply V6 physical coordinates and pointer
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          git -C cemu diff --check

          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $controller.Contains("physical_vertical = orientation == JoyConOrientation::Sideways")) { throw "V6 physical orientation routing missing" }
          if (-not $controller.Contains("get_joycon_orientation() == JoyConOrientation::Sideways")) { throw "V6 physical Vertical control transform missing" }
          if ($provider.Contains("flip_horizontal_motion")) { throw "Legacy X-only motion flip still present" }
          if (-not $provider.Contains("horizontal -> vertical, -90 degrees around Y")) { throw "V6 R vertical IMU matrix missing" }
          if (-not $wpad.Contains("m_joycon_pointer_reference")) { throw "V6 absolute pointer reference missing" }
          if ($wpad.Contains("m_joycon_pointer_last_orientation")) { throw "V5 pointer integrator survived" }
          Write-Host "Verified V6 source invariants."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V6
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @("Joy-Con L", "Joy-Con R", "Orientation:", "Sideways hotkey", "Vertical hotkey", "Fast-forward ON (4x)", "Fast-forward OFF (1x)")) {
            if (-not $ascii.Contains($marker)) { throw "Custom marker missing: $marker" }
          }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu Joy-Con Orientation V6
          ===========================
          Upstream Cemu commit: $env:CEMU_COMMIT

          V6 hardware-correction build:
          - User Sideways leaves SDL mini-gamepad controls unrotated.
          - User Vertical applies the L/R control rotation exactly once.
          - Motion provider receives the true physical orientation.
          - Removed the obsolete V4/V5 X-only empirical motion flip.
          - Joy-Con L/R Vertical use one full 3-axis basis conversion; Sideways IMU is untouched.
          - Wii Remote pointer uses an absolute neutral-reference orientation with deadzone and smoothing instead of accumulated gyro drift.
          - V5 Fast-forward and OSD behavior retained.
          "@ | Set-Content "package\README-JoyCon-Orientation-V6.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          $zip = "Cemu-JoyCon-Orientation-V6-Windows-x64.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Orientation-V6-Windows-x64
          path: Cemu-JoyCon-Orientation-V6-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
