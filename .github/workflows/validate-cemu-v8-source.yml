name: Validate Cemu Joy-Con V8 Source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-cemu-v8-source.yml"
      - "tools/apply_cemu_v8_motion_pointer_calibration.py"
      - "tools/apply_cemu_v8_postfix.py"
      - "V8-CI-TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: false
          fetch-depth: 1

      - name: Apply V2 through V6
        shell: bash
        run: |
          set -e
          python wrapper/tools/apply_cemu_sideways.py cemu
          python wrapper/tools/apply_cemu_v3_detection_fix.py cemu
          python wrapper/tools/apply_cemu_v4_motion_osd.py cemu
          set +e
          python wrapper/tools/apply_cemu_v5_pointer_orientation_fastforward.py cemu
          stage1=$?
          set -e
          if ! grep -q "update_joycon_pointer" cemu/src/input/emulated/WPADController.cpp; then
            echo "V5 stage1 pointer prefix missing" >&2; exit 1
          fi
          echo "V5 stage1 exit=$stage1 (legacy KPAD anchor failure is expected)"
          python wrapper/tools/apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper/tools/apply_cemu_v6_input_coordinates_pointer.py cemu

      - name: Apply V7 pointer toggle
        run: python wrapper/tools/apply_cemu_v7_pointer_gyro_toggle.py cemu

      - name: Apply V8 3D pointer and calibration
        run: |
          python wrapper/tools/apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper/tools/apply_cemu_v8_postfix.py cemu
          git -C cemu diff --check

      - name: Verify V8 invariants
        shell: python
        run: |
          from pathlib import Path
          controller = Path('cemu/src/input/api/SDL/SDLController.cpp').read_text(encoding='utf-8')
          header = Path('cemu/src/input/api/SDL/SDLController.h').read_text(encoding='utf-8')
          provider = Path('cemu/src/input/api/SDL/SDLControllerProvider.cpp').read_text(encoding='utf-8')
          wpad = Path('cemu/src/input/emulated/WPADController.cpp').read_text(encoding='utf-8')
          panel = Path('cemu/src/gui/wxgui/input/panels/WiimoteInputPanel.cpp').read_text(encoding='utf-8')

          checks = {
              'R Sideways X/Z normalization': '!config->second.vertical && !config->second.is_left' in provider and 'sensor_data[2] = -sensor_data[2];' in provider,
              'motion scale state': 'motion_scale_x' in header and 'set_joycon_motion_scale' in provider,
              'scale preserved on orientation': 'Preserve V8 per-device motion calibration' in provider,
              '3D attitude pointer': 'getVPADAttitudeMatrix(attitude)' in controller,
              '3D forward ray': 'current_forward = attitude + 3' in controller and 'reference_forward' in controller,
              'roll-independent angular projection': 'std::atan2(dot3(current_forward, reference_right)' in controller and 'std::atan2(dot3(current_forward, reference_up)' in controller,
              'WPAD delegation': 'joycon->update_joycon_pointer(position, previous)' in wpad,
              'pointer calibration profile': 'joycon_pointer_yaw_deg' in controller and 'joycon_pointer_pitch_deg' in controller,
              'motion calibration profile': 'joycon_motion_scale_x' in controller and 'joycon_motion_scale_z' in controller,
              'pointer recenter UI': 'Recenter pointer' in panel,
              'pointer preview UI': 'm_joycon_pointer_preview' in panel and 'on_joycon_pointer_paint' in panel,
              'pointer tunables': 'Yaw °' in panel and 'Pitch °' in panel and 'Deadzone °' in panel and 'Smooth' in panel,
              'motion tunables': 'Motion calibration:' in panel and 'Reset motion' in panel,
              'live motion readout': 'Gyro %.2f %.2f %.2f' in panel,
              'pointer enable retained': 'm_pointer_enabled' in header and 'm_pointer_hotkey' in header,
          }
          for name, ok in checks.items():
              print(f"{'OK' if ok else 'FAIL'}: {name}")
              if not ok:
                  raise SystemExit(1)
          print('All V8 source invariants verified.')
