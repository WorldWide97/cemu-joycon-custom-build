# TEMPORARY CI harness for isolated Nintendo Switch Sports V3 compatibility testing.
name: Build Eden Switch Sports V3

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-eden-switch-sports-v3.yml'
      - 'patches/eden-switch-sports-v1.patch'
      - 'patches/eden-switch-sports-v2-local-bindless.patch'
      - 'patches/eden-switch-sports-v3-device-memory.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Checkout Eden v0.0.4-rc3
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: v0.0.4-rc3
          path: eden
          fetch-depth: 1

      - name: Apply Switch Sports V1 V2 and V3 patches
        shell: pwsh
        run: |
          Set-Location eden
          git apply --check ../custom/patches/eden-switch-sports-v1.patch
          git apply ../custom/patches/eden-switch-sports-v1.patch
          git apply --check ../custom/patches/eden-switch-sports-v2-local-bindless.patch
          git apply ../custom/patches/eden-switch-sports-v2-local-bindless.patch
          git apply --check ../custom/patches/eden-switch-sports-v3-device-memory.patch
          git apply ../custom/patches/eden-switch-sports-v3-device-memory.patch
          git diff --check
          Write-Host 'Applied V1 SSBO + V2 bindless isolation + V3 DeviceMemoryManager stability/trace patch.'
          git diff -- src/video_core/buffer_cache/buffer_cache.h src/shader_recompiler/ir_opt/texture_pass.cpp src/core/device_memory_manager.inc

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version
          cmake --version

      - name: Install Vulkan SDK required by Eden
        shell: pwsh
        run: |
          Set-Location eden
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows/install-vulkan-sdk.ps1

      - name: Configure Eden
        shell: pwsh
        run: |
          cmake -S eden -B eden/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_QT=ON `
            -DENABLE_QT_TRANSLATION=ON `
            -DENABLE_SDL2=ON `
            -DYUZU_USE_BUNDLED_QT=ON `
            -DYUZU_USE_BUNDLED_SDL2=ON `
            -DYUZU_USE_BUNDLED_FFMPEG=ON `
            -DYUZU_USE_CPM=ON `
            -DENABLE_WEB_SERVICE=OFF `
            -DUSE_DISCORD_PRESENCE=OFF `
            -DBUILD_TESTING=OFF `
            -DYUZU_TESTS=OFF `
            -DDYNARMIC_TESTS=OFF `
            -DYUZU_CMD=OFF `
            -DYUZU_ROOM=OFF `
            -DYUZU_ROOM_STANDALONE=OFF `
            -DYUZU_USE_QT_MULTIMEDIA=OFF `
            -DYUZU_USE_QT_WEB_ENGINE=OFF `
            -DYUZU_ENABLE_LTO=OFF `
            -DDYNARMIC_ENABLE_LTO=OFF `
            -DENABLE_UPDATE_CHECKER=OFF

      - name: Build Eden
        shell: pwsh
        run: cmake --build eden/build --parallel 4

      - name: Package Windows x64 V3 test build
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'eden/build/bin'
          if (-not (Test-Path (Join-Path $bin 'eden.exe'))) {
            throw 'eden.exe was not produced.'
          }
          $dist = Join-Path $PWD 'dist/Eden-Switch-Sports-V3-Windows-x64'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$bin/*" $dist -Recurse -Force
          Copy-Item 'eden/LICENSE*' $dist -Force -ErrorAction SilentlyContinue
          Copy-Item 'eden/README*' $dist -Force -ErrorAction SilentlyContinue
          @'
          Eden Switch Sports V3 test build
          Base: Eden v0.0.4-rc3
          V1: data-driven NVN SSBO descriptor size detection (Eden #4041 lineage).
          V2: per-TexturePass bindless fallback isolation.
          V3 fix: adapted backport of Eden 29f712d (#4098), replacing MultiAddressContainer entry storage with std::vector and batching ScratchBuffer growth to avoid stale pointer/iterator behavior in multi-address scatter/gather.
          V3 diagnostics: trace large GPU Map/Unmap operations and mappings overlapping 0x8A000000-0x8B000000; distinguish SAFE vs UNSAFE unmapped ReadBlock and log chunk/continuity/neighbour state.
          Evidence: V2 log ends at 0x8A400000 with one unmapped 4 MiB Device ReadBlock and does not hit the V2 bindless diagnostic exception.
          '@ | Set-Content -Path (Join-Path $dist 'SWITCH-SPORTS-V3.txt') -Encoding UTF8
          Compress-Archive -Path "$dist/*" -DestinationPath 'dist/Eden-Switch-Sports-V3-Windows-x64.zip' -Force
          Get-FileHash 'dist/Eden-Switch-Sports-V3-Windows-x64.zip' -Algorithm SHA256 | Format-List

      - name: Upload V3 test build
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Switch-Sports-V3-Windows-x64
          path: dist/Eden-Switch-Sports-V3-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
