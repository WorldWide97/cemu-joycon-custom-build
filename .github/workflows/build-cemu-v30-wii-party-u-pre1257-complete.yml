name: Build V30 Wii Party U Pre-1257 Complete Windows

on:
  push:
    branches: [wii-party-u-v30-pre1257-complete]
    paths:
      - "tools/apply_cemu_v28_legacy_h264_cmake.py"
      - ".github/workflows/build-cemu-v30-wii-party-u-pre1257-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper V30
        uses: actions/checkout@v6
        with:
          ref: wii-party-u-v30-pre1257-complete
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply hardware-approved V22 V25-Z and V26
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          python wrapper\tools\apply_cemu_v25_mario_kart_lr_mirror.py cemu Z
          python wrapper\tools\apply_cemu_v26_mario_kart_shortcut_semantics.py cemu
          git -C cemu diff --check

      - name: Restore complete pre-1257 H264 and SysHeap behavior
        shell: pwsh
        run: |
          $beforeWpad = (Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash
          $beforeProvider = (Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash
          $beforeController = (Get-FileHash "cemu\src\input\api\SDL\SDLController.cpp" -Algorithm SHA256).Hash

          git -C cemu fetch origin refs/tags/v2.0-88:refs/tags/v2.0-88 --depth=1

          # V28 already proved that decoder+parser alone are insufficient.
          # V30 also restores coreinit SysHeap implementation from the known-good
          # pre-#1257 snapshot, covering the additional non-H264 file changed by #1257.
          git -C cemu checkout v2.0-88 -- `
            src/Cafe/OS/libs/h264_avc/H264Dec.cpp `
            src/Cafe/OS/libs/h264_avc/parser `
            src/Cafe/OS/libs/coreinit/coreinit_SysHeap.cpp

          $legacyH264Blob = (git -C cemu hash-object src/Cafe/OS/libs/h264_avc/H264Dec.cpp).Trim()
          if ($legacyH264Blob -ne "024965fd0b0d10611c9fb6e0a08ecd399865ec49") { throw "Unexpected v2.0-88 H264Dec blob: $legacyH264Blob" }

          $legacyHeapBlob = (git -C cemu hash-object src/Cafe/OS/libs/coreinit/coreinit_SysHeap.cpp).Trim()
          if ($legacyHeapBlob -ne "e37949d7784c75dc5c0f7d6c441e3351ee5bcf34") { throw "Unexpected pre-1257 SysHeap blob: $legacyHeapBlob" }

          python wrapper\tools\apply_cemu_v28_legacy_h264_cmake.py cemu
          git -C cemu diff --check

          if ((Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash -ne $beforeWpad) { throw "V30 changed V26 WPAD motion math" }
          if ((Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash -ne $beforeProvider) { throw "V30 changed V26 motion provider" }
          if ((Get-FileHash "cemu\src\input\api\SDL\SDLController.cpp" -Algorithm SHA256).Hash -ne $beforeController) { throw "V30 changed V26 Mario Kart shortcut behavior" }

          $h264 = Get-Content "cemu\src\Cafe\OS\libs\h264_avc\H264Dec.cpp" -Raw
          foreach ($marker in @(
            "_async_H264DECExecute",
            "coreinit::OSWaitEvent(&executeDoneEvent);",
            "V28 compatibility bridge",
            "COSModule* GetModule()"
          )) {
            if (-not $h264.Contains($marker)) { throw "V30 legacy H264 marker missing: $marker" }
          }
          if ($h264.Contains("QueueForDecode")) { throw "Modern H264 decode-ahead leaked into V30" }

          $heap = Get-Content "cemu\src\Cafe\OS\libs\coreinit\coreinit_SysHeap.cpp" -Raw
          if (-not $heap.Contains('osLib_addFunction("coreinit", "OSAllocFromSystem", export_OSAllocFromSystem);')) { throw "Pre-1257 SysHeap export missing" }
          if ($heap.Contains('cafeExportRegister("h264", OSAllocFromSystem')) { throw "Post-1257 SysHeap export leaked into V30" }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build V30 Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V30
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "V30 Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu V30 - Wii Party U Complete Pre-1257 Compatibility Test
          ===========================================================
          Base: hardware-approved V26 custom Joy-Con/motion build.
          Current Cemu base: f6a8883d2913be1b0f06ef7065f1bf1fab800b43.

          Proven hardware result:
          - PRE-1257 (4b9c7c0) works in Wii Party U across multiple tested games.
          - POST-1257 (f1685ea) crashes immediately when selecting a game.

          V30 restores:
          - H264Dec.cpp from Cemu 2.0-88 / pre-1257 behavior.
          - H264 parser from Cemu 2.0-88.
          - coreinit SysHeap implementation/export behavior from pre-1257.
          - Modern module-loader bridge only where required to compile current Cemu.
          - All V26 Joy-Con, pointer, motion and Mario Kart custom behavior stays intact.

          Primary test: launch Wii Party U and select the same modes that worked on PRE-1257.
          "@ | Set-Content "package\README-V30.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-V30-Wii-Party-U-Pre1257-Complete-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "V30 Cemu.exe SHA-256: $hash"

      - name: Upload V30 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-V30-Wii-Party-U-Pre1257-Complete-Windows-x64
          path: Cemu-V30-Wii-Party-U-Pre1257-Complete-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
