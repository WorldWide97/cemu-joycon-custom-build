name: Build V31 Wii Party U Exact Pre-1257 Windows

on:
  push:
    branches: [wii-party-u-v31-exact-pre1257-8files]
    paths:
      - ".github/workflows/build-cemu-v31-wii-party-u-exact-pre1257.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout wrapper V31
        uses: actions/checkout@v6
        with:
          ref: wii-party-u-v31-exact-pre1257-8files
          path: wrapper

      - name: Checkout pinned Cemu
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply V2 through V4
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_sideways.py cemu
          python wrapper\tools\apply_cemu_v3_detection_fix.py cemu
          python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 stage 1
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE
          if ($stage1Exit -ne 0) { Write-Host "Expected legacy KPAD anchor reached; continuing." }
          $global:LASTEXITCODE = 0

      - name: Apply V5 through V8
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          python wrapper\tools\apply_cemu_v6_input_coordinates_pointer.py cemu
          python wrapper\tools\apply_cemu_v7_pointer_gyro_toggle.py cemu
          python wrapper\tools\apply_cemu_v8_motion_pointer_calibration.py cemu
          python wrapper\tools\apply_cemu_v8_postfix.py cemu
          python wrapper\tools\apply_cemu_resizable_input_settings.py cemu

      - name: Apply V9 through V14
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v9_precision_motion_pointer.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_motion_core.py cemu
          python wrapper\tools\apply_cemu_v10_dolphin_postfix.py cemu
          python wrapper\tools\apply_cemu_v11_dolphin_wiimote_input.py cemu
          python wrapper\tools\apply_cemu_v12_dolphin_motion_visualizer.py cemu
          python wrapper\tools\apply_cemu_v13_exact_dolphin_motion_input.py cemu
          python wrapper\tools\apply_cemu_v14_v9_game_motion.py cemu

      - name: Apply hardware-approved V22 V25-Z and V26
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v15_r_sideways_kpad_wheel.py cemu
          python wrapper\tools\apply_cemu_v16_restore_v7_kpad_down.py cemu
          python wrapper\tools\apply_cemu_v21_motion_stack.py cemu
          python wrapper\tools\apply_cemu_v22_motion_basis_fix.py cemu
          python wrapper\tools\apply_cemu_v25_mario_kart_lr_mirror.py cemu Z
          python wrapper\tools\apply_cemu_v26_mario_kart_shortcut_semantics.py cemu
          git -C cemu diff --check

      - name: Revert all eight files changed by H264 PR 1257
        shell: pwsh
        run: |
          $beforeWpad = (Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash
          $beforeProvider = (Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash
          $beforeController = (Get-FileHash "cemu\src\input\api\SDL\SDLController.cpp" -Algorithm SHA256).Hash

          git -C cemu fetch origin 4b9c7c0d307495c679127381d6f00bab9f0c2933 --depth=1
          git -C cemu checkout FETCH_HEAD -- `
            src/Cafe/OS/libs/h264_avc/H264Dec.cpp `
            src/Cafe/OS/libs/h264_avc/parser/H264Parser.cpp `
            src/Cafe/OS/libs/h264_avc/parser/H264Parser.h `
            src/Cafe/OS/libs/coreinit/coreinit_SysHeap.cpp `
            src/Cafe/OS/libs/coreinit/coreinit_SysHeap.h

          # Files added by #1257 must not remain in the effective source tree.
          Remove-Item -Force -ErrorAction SilentlyContinue "cemu\src\Cafe\OS\libs\h264_avc\H264DecBackendAVC.cpp"
          Remove-Item -Force -ErrorAction SilentlyContinue "cemu\src\Cafe\OS\libs\h264_avc\H264DecInternal.h"

          # Current Cemu needs the COSModule wrapper; this script also removes the
          # two #1257 backend entries from Cafe/CMakeLists.txt.
          python wrapper\tools\apply_cemu_v28_legacy_h264_cmake.py cemu

          $h264Blob = (git -C cemu hash-object src/Cafe/OS/libs/h264_avc/H264Dec.cpp).Trim()
          if ($h264Blob -ne "024965fd0b0d10611c9fb6e0a08ecd399865ec49") { throw "Unexpected PRE H264Dec blob: $h264Blob" }
          $heapCppBlob = (git -C cemu hash-object src/Cafe/OS/libs/coreinit/coreinit_SysHeap.cpp).Trim()
          if ($heapCppBlob -ne "e37949d7784c75dc5c0f7d6c441e3351ee5bcf34") { throw "Unexpected PRE SysHeap.cpp blob: $heapCppBlob" }
          $heapHBlob = (git -C cemu hash-object src/Cafe/OS/libs/coreinit/coreinit_SysHeap.h).Trim()
          if ($heapHBlob -ne "428224af28200e14c9bbce0b8483447b094af7bc") { throw "Unexpected PRE SysHeap.h blob: $heapHBlob" }

          if (Test-Path "cemu\src\Cafe\OS\libs\h264_avc\H264DecBackendAVC.cpp") { throw "#1257 backend cpp still exists" }
          if (Test-Path "cemu\src\Cafe\OS\libs\h264_avc\H264DecInternal.h") { throw "#1257 internal header still exists" }

          $cmake = Get-Content "cemu\src\Cafe\CMakeLists.txt" -Raw
          if ($cmake.Contains("H264DecBackendAVC.cpp") -or $cmake.Contains("H264DecInternal.h")) { throw "#1257 CMake entries still exist" }

          if ((Get-FileHash "cemu\src\input\emulated\WPADController.cpp" -Algorithm SHA256).Hash -ne $beforeWpad) { throw "V31 changed V26 WPAD motion math" }
          if ((Get-FileHash "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Algorithm SHA256).Hash -ne $beforeProvider) { throw "V31 changed V26 motion provider" }
          if ((Get-FileHash "cemu\src\input\api\SDL\SDLController.cpp" -Algorithm SHA256).Hash -ne $beforeController) { throw "V31 changed V26 Mario Kart behavior" }

          git -C cemu diff --check

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build V31 Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Package V31
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "V31 Cemu executable was not produced" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force
          @"
          Cemu V31 - Exact PRE-1257 Eight-File Revert Test
          =================================================
          Base: V26 custom Joy-Con / motion / pointer build.
          Modern Cemu base: f6a8883d2913be1b0f06ef7065f1bf1fab800b43.
          Known-good boundary: PRE 4b9c7c0 works; POST f1685ea fails.

          V31 reverses every direct file change from #1257:
          - Cafe/CMakeLists.txt: async backend entries removed
          - coreinit_SysHeap.cpp: PRE version
          - coreinit_SysHeap.h: PRE version
          - H264Dec.cpp: PRE version + only modern COSModule registration bridge
          - H264DecBackendAVC.cpp: removed
          - H264DecInternal.h: removed
          - H264Parser.cpp: PRE version
          - H264Parser.h: PRE version

          All V26 Joy-Con/motion/pointer/Mario Kart patches remain applied.
          "@ | Set-Content "package\README-V31.txt" -Encoding utf8
          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii
          Compress-Archive -Path "package\*" -DestinationPath "Cemu-V31-Wii-Party-U-Exact-PRE1257-8Files-Windows-x64.zip" -CompressionLevel Optimal -Force
          Write-Host "V31 Cemu.exe SHA-256: $hash"

      - name: Upload V31 Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-V31-Wii-Party-U-Exact-PRE1257-8Files-Windows-x64
          path: Cemu-V31-Wii-Party-U-Exact-PRE1257-8Files-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
