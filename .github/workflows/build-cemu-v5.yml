name: Build Cemu Joy-Con Orientation V6

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply Joy-Con orientation V2 core patch
        shell: pwsh
        run: python wrapper\tools\apply_cemu_sideways.py cemu

      - name: Apply V3 robust Joy-Con detection fix
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v3_detection_fix.py cemu

      - name: Apply V4 motion and OSD fixes
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 orientation motion and pointer core
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE

          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw

          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core was not applied" }
          if (-not $provider.Contains("!config->second.is_left && config->second.vertical")) { throw "V5 intermediate motion correction missing" }
          if (-not $panel.Contains("Internal Vertical == physical Sideways")) { throw "V5 intermediate UI mapping missing" }
          if (-not $controller.Contains('orientation == JoyConOrientation::Vertical ? "Sideways" : "Vertical"')) { throw "V5 intermediate OSD mapping missing" }

          if ($stage1Exit -ne 0) {
            Write-Host "V5 Stage 1 reached its known legacy KPAD anchor; continuing with Stage 2."
          }
          $global:LASTEXITCODE = 0

      - name: Apply V5 robust KPAD WPAD pointer and frame fast-forward
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu

      - name: Apply V6 sideways semantics motion and precision pointer fix
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v6_sideways_pointer_fix.py cemu
          git -C cemu diff --check
          git -C cemu status --short

          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw

          if (-not $controller.Contains("SDL mini-gamepad mode is already the physical Sideways layout")) { throw "V6 direct Sideways semantics missing" }
          if (-not $controller.Contains('orientation == JoyConOrientation::Vertical ? "Vertical" : "Sideways"')) { throw "V6 OSD orientation semantics missing" }
          if (-not $provider.Contains("!config->second.is_left && !config->second.vertical")) { throw "V6 R Sideways motion sign correction missing" }
          if ($panel.Contains("Internal Vertical == physical Sideways")) { throw "Old inverted V5 UI semantics still present" }
          if (-not $wpad.Contains("m_joycon_pointer_filtered_gyro")) { throw "V6 filtered gyro pointer missing" }
          if (-not $wpad.Contains("kHorizontalGain = 4.6f")) { throw "V6 pointer gain missing" }
          if (-not $wpad.Contains("getVPADGyroChange")) { throw "V6 gyro-rate pointer path missing" }

          Write-Host "Verified complete V6 source paths."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -G "Visual Studio 17 2022" -A x64 -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V6
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @("Joy-Con L", "Joy-Con R", "Orientation:", "Sideways hotkey", "Vertical hotkey", "Fast-forward ON (4x)", "Fast-forward OFF (1x)")) {
            if (-not $ascii.Contains($marker)) { throw "Custom V6 marker missing from Cemu.exe: $marker" }
            Write-Host "Verified marker: $marker"
          }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force

          @"
          Cemu Joy-Con Orientation V6
          ===========================
          Upstream Cemu commit: $env:CEMU_COMMIT

          V6 corrections:
          - Sideways now uses SDL3 Joy-Con mini-gamepad mapping directly; no extra stick/button rotation.
          - Vertical alone uses the explicit Cemu 90-degree transform.
          - Physical Joy-Con L Vertical and Joy-Con R Sideways horizontal motion sign correction restored.
          - Fast-forward V5 behavior retained unchanged.
          - Wii Remote Joy-Con pointer now integrates filtered gyro rate using real frame time instead of differentiating fused Euler orientation.
          - Pointer dead-zone and low-pass filtering added to reduce jitter and fusion jumps.
          "@ | Set-Content "package\README-JoyCon-Orientation-V6.txt" -Encoding utf8

          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii

          $zip = "Cemu-JoyCon-Orientation-V6-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Final ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Orientation-V6-Windows-x64
          path: Cemu-JoyCon-Orientation-V6-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
