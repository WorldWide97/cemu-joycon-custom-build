name: Build Cemu Joy-Con Orientation V5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-cemu-v5.yml"
      - "tools/apply_cemu_sideways.py"
      - "tools/apply_cemu_v3_detection_fix.py"
      - "tools/apply_cemu_v4_motion_osd.py"
      - "tools/apply_cemu_v5_pointer_orientation_fastforward.py"
      - "tools/apply_cemu_v5_stage2_pointer_kpad_fastforward.py"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: clear
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CEMU_COMMIT: f6a8883d2913be1b0f06ef7065f1bf1fab800b43

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          path: wrapper

      - name: Checkout pinned Cemu source
        uses: actions/checkout@v6
        with:
          repository: cemu-project/Cemu
          ref: f6a8883d2913be1b0f06ef7065f1bf1fab800b43
          path: cemu
          submodules: recursive
          fetch-depth: 1

      - name: Apply Joy-Con orientation V2 core patch
        shell: pwsh
        run: python wrapper\tools\apply_cemu_sideways.py cemu

      - name: Apply V3 robust Joy-Con detection fix
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v3_detection_fix.py cemu

      - name: Apply V4 motion and OSD fixes
        shell: pwsh
        run: python wrapper\tools\apply_cemu_v4_motion_osd.py cemu

      - name: Apply V5 orientation motion and pointer core
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_pointer_orientation_fastforward.py cemu
          $stage1Exit = $LASTEXITCODE

          # Stage 1 currently stops at the old full-block KPAD anchor after all
          # orientation/motion/pointer-core changes are already applied. Verify
          # those exact changes before allowing the robust Stage 2 to continue.
          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          $provider = Get-Content "cemu\src\input\api\SDL\SDLControllerProvider.cpp" -Raw
          $panel = Get-Content "cemu\src\gui\wxgui\input\panels\WiimoteInputPanel.cpp" -Raw
          $controller = Get-Content "cemu\src\input\api\SDL\SDLController.cpp" -Raw

          if (-not $wpad.Contains("update_joycon_pointer")) { throw "V5 pointer core was not applied" }
          if (-not $provider.Contains("!config->second.is_left && config->second.vertical")) { throw "V5 R Sideways motion correction missing" }
          if (-not $panel.Contains("Internal Vertical == physical Sideways")) { throw "V5 physical orientation UI mapping missing" }
          if (-not $controller.Contains('orientation == JoyConOrientation::Vertical ? "Sideways" : "Vertical"')) { throw "V5 orientation OSD mapping missing" }

          if ($stage1Exit -ne 0) {
            Write-Host "V5 Stage 1 reached the known legacy KPAD anchor; verified all preceding V5 changes. Continuing with robust Stage 2."
          }

      - name: Apply V5 robust KPAD WPAD pointer and frame fast-forward
        shell: pwsh
        run: |
          python wrapper\tools\apply_cemu_v5_stage2_pointer_kpad_fastforward.py cemu
          git -C cemu diff --check
          git -C cemu status --short

          $wpad = Get-Content "cemu\src\input\emulated\WPADController.cpp" -Raw
          if (-not $wpad.Contains("has_joycon_pointer")) { throw "V5 raw WPAD DPD pointer code missing" }
          if (-not $wpad.Contains("route Joy-Con gyro pointer")) {
            # The literal comment is not required; functional marker below is.
            if (-not $wpad.Contains("status.dpd_valid_fg = 2")) { throw "V5 KPAD pointer fallback missing" }
          }

          $timing = Get-Content "cemu\src\Cafe\HW\Latte\Core\LatteTiming.cpp" -Raw
          if (-not $timing.Contains("signalCount")) { throw "V5 frame-driven fast-forward path missing" }
          if (-not $timing.Contains("GetTimerShiftFactor")) { throw "V5 virtual VSync timer scaling missing" }

          Write-Host "Verified complete V5 source paths."

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\cemu\dependencies\vcpkg\bootstrap-vcpkg.bat

      - name: Configure Cemu Release
        shell: pwsh
        run: cmake -S cemu -B cemu/build -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu Release
        shell: pwsh
        run: cmake --build cemu/build --config release

      - name: Verify and package V5
        shell: pwsh
        run: |
          $exe = "cemu\bin\Cemu_release.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe was not produced" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @("Joy-Con L", "Joy-Con R", "Orientation:", "Sideways hotkey", "Vertical hotkey", "Fast-forward ON (4x)", "Fast-forward OFF (1x)")) {
            if (-not $ascii.Contains($marker)) { throw "Custom V5 marker missing from Cemu.exe: $marker" }
            Write-Host "Verified marker: $marker"
          }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe "package\Cemu.exe" -Force

          @"
          Cemu Joy-Con Orientation V5
          ===========================
          Upstream Cemu commit: $env:CEMU_COMMIT

          V5:
          - Correct physical Vertical / Sideways labels and hotkeys.
          - No new stick changes.
          - Correct Joy-Con L Vertical and Joy-Con R Sideways horizontal motion sign.
          - Wii Remote-only Joy-Con gyro pointer for KPAD and raw WPAD DPD/IR paths.
          - Pointer starts centered and recenters after orientation/fusion discontinuities.
          - Fast-forward remains Toggle 1x <-> 4x.
          - Latte/GX2 virtual VSync follows TimerShiftFactor for frame-driven games.
          - Orientation and Fast-forward OSD notifications retained.
          "@ | Set-Content "package\README-JoyCon-Orientation-V5.txt" -Encoding utf8

          $hash = (Get-FileHash "package\Cemu.exe" -Algorithm SHA256).Hash
          "Cemu.exe SHA-256: $hash" | Set-Content "package\SHA256.txt" -Encoding ascii

          $zip = "Cemu-JoyCon-Orientation-V5-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "package\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Final ZIP was not produced" }
          Write-Host "Cemu.exe SHA-256: $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-JoyCon-Orientation-V5-Windows-x64
          path: Cemu-JoyCon-Orientation-V5-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
